<!DOCTYPE html>
<html lang="pt-MZ" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Entrar na Conta - PayGo Moçambique</title>
    <meta name="description" content="Faça login na sua conta PayGo.">
    <meta name="theme-color" content="#0f172a">
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%233b82f6' stroke='none'><polygon points='13 2 3 14 12 14 11 22 21 10 12 10 13 2'></polygon></svg>">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
    tailwind.config = {
        theme: {
            extend: {
                fontFamily: {
                    sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    display: ['"Outfit"', 'sans-serif'],
                },
                colors: {
                    brand: { 50: '#eff6ff', 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a', 950: '#0f172a' },
                    success: { 400: '#4ade80', 500: '#22c55e', 600: '#16a34a' },
                    danger: { 400: '#f87171', 500: '#ef4444' }
                }
            }
        }
    }
    </script>
    
    <style>
        .bg-noise { background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.025'/%3E%3C/svg%3E"); pointer-events: none; position: fixed; inset: 0; z-index: 1; }
        
        .glass-card { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        
        /* Floating Labels Inputs */
        .input-field { position: relative; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; transition: all 0.3s ease; }
        .input-field:focus-within { border-color: #3b82f6; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); background: rgba(255,255,255,0.05); }
        .input-field input { width: 100%; padding: 1.125rem 1rem 1.125rem 3rem; background: transparent; border: none; outline: none; color: #fff; font-size: 0.9375rem; }
        .input-field input::placeholder { color: transparent; }
        .input-label { position: absolute; left: 3rem; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.4); font-size: 0.9375rem; pointer-events: none; transition: all 0.2s ease; }
        
        /* Floating Logic */
        .input-field input:focus ~ .input-label, .input-field input:not(:placeholder-shown) ~ .input-label {
            top: 0; transform: translateY(-50%); left: 2.5rem; font-size: 0.75rem; font-weight: 600; color: #3b82f6; background: #0f172a; padding: 0 0.5rem; letter-spacing: 0.05em; border-radius: 4px;
        }
        
        /* Icons */
        .input-icon { position: absolute; left: 1rem; top: 1.125rem; color: rgba(255,255,255,0.3); transition: color 0.3s ease; width: 1.25rem; height: 1.25rem; pointer-events: none; }
        .input-field:focus-within .input-icon { color: #3b82f6; }

        /* Buttons */
        .btn-loading { pointer-events: none; opacity: 0.9; }
        .btn-loading .btn-text { opacity: 0; }
        .btn-loading .btn-spinner { opacity: 1; transform: scale(1); }
        .btn-spinner { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; transform: scale(0.8); transition: all 0.3s ease; }

        /* Toasts */
        #toast-container { position: fixed; top: 24px; right: 24px; z-index: 1000; display: flex; flex-direction: column; gap: 12px; pointer-events: none; }
        .toast { pointer-events: auto; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.1); border-left: 4px solid #3b82f6; padding: 16px; border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); display: flex; align-items: center; gap: 12px; max-width: 400px; transform: translateX(120%); transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55); opacity: 0; }
        .toast.show { transform: translateX(0); opacity: 1; }
        .toast.success { border-left-color: #22c55e; }
        .toast.error { border-left-color: #ef4444; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 font-sans min-h-screen flex items-center justify-center relative overflow-hidden selection:bg-brand-500 selection:text-white">

    <div class="bg-noise"></div>
    
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-brand-600/20 rounded-full mix-blend-screen filter blur-[100px] pointer-events-none"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-accent-500/10 rounded-full mix-blend-screen filter blur-[100px] pointer-events-none"></div>

    <div id="toast-container"></div>

    <a href="index.html" class="absolute top-6 left-6 z-20 flex items-center gap-2 text-slate-400 hover:text-white transition-colors text-sm font-medium bg-slate-900/50 backdrop-blur px-4 py-2 rounded-full border border-slate-800">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Voltar à página inicial
    </a>

    <div class="container mx-auto px-6 relative z-10 py-12 flex justify-center">
        <div class="w-full max-w-md">
            
            <div class="text-center mb-8">
                <a href="index.html" class="inline-flex items-center gap-2 group mb-2">
                    <div class="bg-gradient-to-tr from-brand-500 to-cyan-500 p-2.5 rounded-xl text-white shadow-lg shadow-brand-500/30 group-hover:scale-105 transition-transform">
                        <i data-lucide="zap" class="w-6 h-6 fill-current"></i>
                    </div>
                    <span class="text-3xl font-display font-bold text-white tracking-tight">PayGo</span>
                </a>
                <p class="text-slate-400 text-sm">Acesse sua conta para continuar</p>
            </div>

            <div class="glass-card rounded-3xl p-8 shadow-2xl">
                
                <div id="affiliatePendingAlert" class="hidden mb-6 bg-success-500/10 border border-success-500/20 rounded-xl p-4 flex items-start gap-3">
                    <i data-lucide="check-circle-2" class="w-5 h-5 text-success-400 mt-0.5 flex-shrink-0"></i>
                    <div>
                        <h4 class="text-sm font-bold text-success-400 mb-1">Candidatura Recebida!</h4>
                        <p class="text-xs text-slate-300">A sua candidatura a afiliado está em análise. Faça login abaixo para acompanhar o status.</p>
                    </div>
                </div>

                <form id="loginForm" class="space-y-5">
                    <div class="input-field">
                        <i data-lucide="mail" class="input-icon"></i>
                        <input type="email" id="email" required placeholder=" " autocomplete="email">
                        <label for="email" class="input-label">Endereço de Email</label>
                    </div>

                    <div>
                        <div class="input-field">
                            <i data-lucide="lock" class="input-icon"></i>
                            <input type="password" id="password" required placeholder=" " autocomplete="current-password">
                            <label for="password" class="input-label">Senha de Acesso</label>
                            <button type="button" onclick="togglePassword()" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-white transition-colors">
                                <i data-lucide="eye" class="w-5 h-5" id="toggleIcon"></i>
                            </button>
                        </div>
                        <div class="flex justify-end mt-2">
                            <button type="button" onclick="showResetModal()" class="text-xs font-medium text-brand-400 hover:text-brand-300 transition-colors">
                                Esqueceu a senha?
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="loginBtn" class="relative w-full bg-brand-600 hover:bg-brand-500 text-white py-4 rounded-xl font-bold text-lg transition-all shadow-lg shadow-brand-600/30 flex items-center justify-center overflow-hidden">
                        <span class="btn-text">Entrar na Conta</span>
                        <span class="btn-spinner"><i data-lucide="loader-2" class="w-6 h-6 animate-spin"></i></span>
                    </button>
                </form>

                <div class="mt-8 pt-6 border-t border-slate-800 text-center">
                    <p class="text-slate-400 text-sm">
                        Ainda não tem conta? 
                        <a href="register.html" class="text-brand-400 hover:text-brand-300 font-bold transition-colors ml-1">Criar conta grátis</a>
                    </p>
                </div>

            </div>
        </div>
    </div>

    <div id="resetModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-sm transform scale-95 transition-transform duration-300" id="resetModalCard">
            <h3 class="text-xl font-bold text-white mb-2">Recuperar Senha</h3>
            <p class="text-sm text-slate-400 mb-6">Digite o seu email para receber um link de redefinição.</p>
            
            <form id="resetForm" class="space-y-4">
                <div class="input-field">
                    <i data-lucide="mail" class="input-icon"></i>
                    <input type="email" id="resetEmail" required placeholder=" ">
                    <label for="resetEmail" class="input-label">Seu Email</label>
                </div>
                
                <div class="flex gap-3">
                    <button type="button" onclick="closeResetModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-white py-3 rounded-xl font-medium transition-colors text-sm">Cancelar</button>
                    <button type="submit" id="resetBtn" class="flex-1 relative bg-brand-600 hover:bg-brand-500 text-white py-3 rounded-xl font-bold transition-all text-sm flex items-center justify-center">
                        <span class="btn-text">Enviar Link</span>
                        <span class="btn-spinner"><i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i></span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAHxyX5e9O8qQo6Z3VHURgVXhxbxSp0Qh8",
            authDomain: "paygo-14311.firebaseapp.com",
            projectId: "paygo-14311",
            storageBucket: "paygo-14311.firebasestorage.app",
            messagingSenderId: "208360646277",
            appId: "1:208360646277:web:aecc57cc0077ae48a52bec"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app, "paygodb");

        // Inicialização de UI
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            
            // Verificar parâmetro affiliate_pending
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('affiliate_pending') === 'true') {
                document.getElementById('affiliatePendingAlert').classList.remove('hidden');
            }
            if (urlParams.get('email')) {
                document.getElementById('email').value = urlParams.get('email');
                document.getElementById('password').focus();
            }
        });

        // Toggle Password
        window.togglePassword = function() {
            const input = document.getElementById('password');
            const icon = document.getElementById('toggleIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                input.type = 'password';
                icon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        };

        // Modal Reset
        const modal = document.getElementById('resetModal');
        const modalCard = document.getElementById('resetModalCard');
        
        window.showResetModal = function() {
            const emailValue = document.getElementById('email').value;
            if(emailValue) document.getElementById('resetEmail').value = emailValue;
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalCard.classList.remove('scale-95');
            }, 10);
        };

        window.closeResetModal = function() {
            modal.classList.add('opacity-0');
            modalCard.classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
        };

        // Toasts
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icon = type === 'success' ? 'check-circle' : 'alert-circle';
            const color = type === 'success' ? 'text-success-400' : 'text-danger-400';
            
            toast.innerHTML = `<i data-lucide="${icon}" class="${color} w-5 h-5 flex-shrink-0"></i><span class="text-sm font-medium text-white">${message}</span>`;
            container.appendChild(toast);
            lucide.createIcons();
            
            requestAnimationFrame(() => toast.classList.add('show'));
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 5000);
        }

        // 🚀 SUBMIT LOGIN
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            btn.classList.add('btn-loading');

            try {
                // 1. Fazer Login no Firebase Auth
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 2. Buscar Dados do Usuário no Firestore
                const userDoc = await getDoc(doc(db, "users", user.uid));
                
                // Padrão para Clientes Normais é a Página Inicial
                let redirectUrl = 'index.html'; 

                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    
                    // 3. Redirecionamento Baseado no Role
                    if (userData.role === 'admin') {
                        redirectUrl = 'admin.html';
                    } else if (userData.role === 'affiliate') {
                        redirectUrl = 'dashboard-afiliado.html';
                    }
                }

                showToast('Login efetuado com sucesso! A redirecionar...', 'success');
                
                // Redireciona
                setTimeout(() => {
                    window.location.href = redirectUrl;
                }, 1000);

            } catch (error) {
                console.error("Erro no login:", error);
                let msg = 'Erro ao efetuar login.';
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                    msg = 'Email ou senha incorretos.';
                } else if (error.code === 'auth/too-many-requests') {
                    msg = 'Muitas tentativas falhadas. Tente novamente mais tarde.';
                }
                showToast(msg, 'error');
                btn.classList.remove('btn-loading');
            }
        });

        // 🚀 RECUPERAR SENHA
        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('resetBtn');
            const email = document.getElementById('resetEmail').value.trim();

            btn.classList.add('btn-loading');

            try {
                await sendPasswordResetEmail(auth, email);
                showToast('Link de recuperação enviado para o seu email!', 'success');
                setTimeout(() => {
                    closeResetModal();
                    btn.classList.remove('btn-loading');
                }, 2000);
            } catch (error) {
                let msg = 'Erro ao enviar email de recuperação.';
                if (error.code === 'auth/user-not-found') {
                    msg = 'Não existe conta associada a este email.';
                }
                showToast(msg, 'error');
                btn.classList.remove('btn-loading');
            }
        });
    </script>
</body>
</html>
