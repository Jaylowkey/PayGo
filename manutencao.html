<!DOCTYPE html>
<html lang="pt-MZ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manutenção | PayGo Moçambique</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .glass-card { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(59, 130, 246, 0.3); box-shadow: 0 0 30px rgba(59, 130, 246, 0.1); }
        .bg-grid { background-size: 40px 40px; background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px); }
    </style>
</head>
<body>
    <div class="fixed inset-0 bg-grid opacity-20 pointer-events-none z-0"></div>
    <div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-brand-600/20 rounded-full mix-blend-screen blur-[120px] pointer-events-none z-0"></div>
    
    <div class="glass-card rounded-3xl p-10 max-w-lg text-center relative z-10 mx-4">
        <div class="w-20 h-20 bg-blue-500/20 text-blue-400 rounded-full flex items-center justify-center mx-auto mb-6 border border-blue-500/30">
            <i data-lucide="wrench" class="w-10 h-10 animate-pulse"></i>
        </div>
        <h1 class="text-3xl font-bold text-white mb-4">Sistema em Atualização</h1>
        <p class="text-slate-400 mb-6 leading-relaxed">
            Estamos a adicionar novas funcionalidades e a otimizar os nossos servidores para lhe oferecer uma experiência ainda mais rápida e segura.<br><br>
            <strong class="text-white">Os seus fundos e cartões estão 100% seguros.</strong> Voltaremos em breve!
        </p>
        <div class="inline-block px-4 py-2 bg-slate-800 rounded-lg text-xs font-mono text-slate-300 border border-slate-700">
            Status: Intervenção Técnica
        </div>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
