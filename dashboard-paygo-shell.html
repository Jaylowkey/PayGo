<!doctype html>
<html lang="pt-MZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>PayGo | Carteira</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#0f172a; }
    #appFrame { width:100%; height:100%; border:0; display:block; background:#0f172a; }
    #shellLoader { position:fixed; inset:0; display:grid; place-items:center; background:#0f172a; color:#e2e8f0; font:600 15px system-ui,-apple-system,Segoe UI,sans-serif; z-index:10; }
    #shellLoader.hidden { display:none; }
  </style>
</head>
<body>
  <div id="shellLoader">A carregar PayGo…</div>
  <iframe id="appFrame" src="/dashboard.html" title="PayGo" referrerpolicy="strict-origin-when-cross-origin"></iframe>

  <script type="module">
    const CONFIG = {
      apiKey: "AIzaSyAHxyX5e9O8qQo6Z3VHURgVXhxbxSp0Qh8",
      authDomain: "paygo-14311.firebaseapp.com",
      projectId: "paygo-14311",
      storageBucket: "paygo-14311.firebasestorage.app",
      messagingSenderId: "208360646277",
      appId: "1:208360646277:web:aecc57cc0077ae48a52bec"
    };
    const CARD_MIN = 50;
    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

    async function initFirebase() {
      const [{ initializeApp, getApps }, authModule, firestore] = await Promise.all([
        import('https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js'),
        import('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js'),
        import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js')
      ]);
      const name = 'paygo-dashboard-shell';
      const app = getApps().find(item => item.name === name) || initializeApp(CONFIG, name);
      return { auth: authModule.getAuth(app), db: firestore.getFirestore(app, 'paygodb'), firestore, onAuthStateChanged: authModule.onAuthStateChanged };
    }

    async function waitForUser(auth, onAuthStateChanged) {
      if (auth.currentUser) return auth.currentUser;
      return new Promise((resolve, reject) => {
        let done = false;
        const timer = setTimeout(() => {
          if (done) return;
          done = true;
          unsubscribe?.();
          reject(new Error('A sessão do cliente não foi carregada. Entre novamente na sua conta.'));
        }, 5000);
        const unsubscribe = onAuthStateChanged(auth, user => {
          if (done || !user) return;
          done = true;
          clearTimeout(timer);
          unsubscribe();
          resolve(user);
        });
      });
    }

    function installStyles(doc) {
      if (doc.getElementById('paygo-card-shell-style')) return;
      const style = doc.createElement('style');
      style.id = 'paygo-card-shell-style';
      style.textContent = `
        #topUpModal .paygo-card-info { margin-top:12px; padding:14px 16px; border:1px solid rgba(59,130,246,.28); background:linear-gradient(135deg,rgba(37,99,235,.12),rgba(15,23,42,.84)); border-radius:16px; color:#cbd5e1; }
        #topUpModal .paygo-card-info strong { color:#fff; }
        #topUpModal .paygo-card-title { color:#60a5fa; font-weight:800; margin-bottom:4px; display:flex; gap:8px; align-items:center; }
        @media (max-width:640px){ #topUpModal>div { max-width:420px !important; } #topUpModal .grid.grid-cols-4 { grid-template-columns:repeat(2,minmax(0,1fr)); } }
      `;
      doc.head.appendChild(style);
    }

    function getMethodInput(doc, value) {
      return doc.querySelector(`input[name="topUpMethod"][value="${value}"]`);
    }

    function ensureCardUi(doc) {
      const legacy = getMethodInput(doc, 'bank');
      const card = getMethodInput(doc, 'card');
      const input = card || legacy;
      if (!input) return null;
      if (!card) input.value = 'card';

      const label = input.closest('label');
      const chip = label?.querySelector('.selection-chip');
      if (chip) chip.textContent = 'VISA / MASTERCARD';

      const phoneLabel = [...doc.querySelectorAll('#topUpModal label')].find(el => (el.textContent || '').includes('Número de Telefone para Pagamento'));
      const phoneWrap = phoneLabel?.parentElement;
      const phone = doc.getElementById('topUpPhone');
      if (phoneWrap) phoneWrap.id = 'topUpPhoneWrap';

      const info = doc.getElementById('bankDetails');
      if (info) {
        info.className = 'paygo-card-info hidden';
        info.innerHTML = '<div class="paygo-card-title">🛡️ Pagamento seguro com cartão</div><div><strong>Visa ou Mastercard</strong></div><div style="margin-top:4px">Será aberto um checkout seguro para concluir o pagamento.</div><div style="margin-top:8px;font-size:11px;color:#94a3b8;border-top:1px solid rgba(255,255,255,.06);padding-top:8px">Valor mínimo: 50 MT. Os dados do cartão não são digitados na PayGo.</div>';
      }

      const originalToggle = doc.defaultView.toggleBankDetails;
      doc.defaultView.toggleBankDetails = function(method) {
        const isCard = method === 'card';
        const wrap = doc.getElementById('topUpPhoneWrap');
        const tel = doc.getElementById('topUpPhone');
        const details = doc.getElementById('bankDetails');
        const button = doc.getElementById('btnProcessTopUp');
        if (wrap) wrap.classList.toggle('hidden', isCard);
        if (tel) {
          tel.disabled = isCard;
          if (isCard) tel.removeAttribute('required'); else tel.setAttribute('required','true');
        }
        if (details) details.classList.toggle('hidden', !isCard);
        if (button) button.textContent = isCard ? 'Continuar para pagamento seguro' : 'Gerar Pagamento';
        if (!isCard && typeof originalToggle === 'function' && originalToggle !== doc.defaultView.toggleBankDetails) {
          try { originalToggle(method); } catch (_) {}
        }
      };

      doc.querySelectorAll('input[name="topUpMethod"]').forEach(el => {
        el.addEventListener('change', () => doc.defaultView.toggleBankDetails(el.value));
      });
      installStyles(doc);
      doc.defaultView.toggleBankDetails(input.checked ? input.value : 'mpesa');
      return input;
    }

    async function processCardPayment(doc) {
      const amount = Number.parseFloat(doc.getElementById('topUpAmount')?.value || doc.getElementById('topUpMtInput')?.value || '0');
      if (!Number.isFinite(amount) || amount < CARD_MIN) {
        doc.defaultView.showToast?.(`Para pagamento com cartão, o mínimo é ${CARD_MIN} MT.`, 'warning');
        return;
      }

      const button = doc.getElementById('btnProcessTopUp');
      const original = button?.innerHTML || 'Continuar para pagamento seguro';
      if (button) {
        button.disabled = true;
        button.textContent = 'A preparar pagamento seguro…';
      }

      try {
        const { auth, db, firestore, onAuthStateChanged } = await initFirebase();
        const user = await waitForUser(auth, onAuthStateChanged);
        const topupId = `TOP-${Date.now().toString().slice(-10)}`;

        await firestore.setDoc(firestore.doc(db, 'topups', topupId), {
          topupId,
          userId: user.uid,
          amount: Number(amount.toFixed(2)),
          method: 'card',
          paymentMethod: 'card',
          phone: null,
          status: 'pending',
          paymentStatus: 'pending',
          provider: 'netshop',
          createdAt: firestore.serverTimestamp(),
          updatedAt: firestore.serverTimestamp()
        });

        const response = await fetch('/api/payments/initiate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            topupId,
            orderId: topupId,
            amount: Number(amount.toFixed(2)),
            method: 'card',
            description: `Depósito PayGo por cartão ${topupId}`
          })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.success) throw new Error(data.error || 'Não foi possível iniciar o pagamento por cartão.');

        const checkoutUrl = data.checkoutUrl || data.data?.checkoutUrl || data.data?.checkout_url || data.checkout_url;
        if (!checkoutUrl) throw new Error('O checkout seguro não foi disponibilizado pelo gateway.');

        doc.defaultView.showToast?.('A abrir o pagamento seguro…', 'success');
        await wait(150);
        window.top.location.assign(checkoutUrl);
      } catch (error) {
        console.error('[PayGo card checkout]', error);
        doc.defaultView.showToast?.(error?.message || 'Falha ao iniciar pagamento por cartão.', 'error');
        if (button) {
          button.disabled = false;
          button.innerHTML = original;
        }
      }
    }

    async function wireFrame(frame) {
      const doc = frame.contentDocument;
      if (!doc) return false;
      ensureCardUi(doc);

      const form = doc.getElementById('topUpForm');
      if (form && form.dataset.paygoCardShell !== '1') {
        form.dataset.paygoCardShell = '1';
        form.addEventListener('submit', event => {
          const selected = doc.querySelector('input[name="topUpMethod"]:checked')?.value;
          if (selected !== 'card') return;
          event.preventDefault();
          event.stopImmediatePropagation();
          void processCardPayment(doc);
        }, true);
      }
      return true;
    }

    const frame = document.getElementById('appFrame');
    frame.addEventListener('load', async () => {
      document.getElementById('shellLoader')?.classList.add('hidden');
      for (let i = 0; i < 10; i++) {
        if (await wireFrame(frame)) break;
        await wait(250);
      }
    });
  </script>
</body>
</html>
