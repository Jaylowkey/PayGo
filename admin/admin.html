<!DOCTYPE html>
<html lang="pt-MZ" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Console Central | PayGo Admin</title>
  <meta name="theme-color" content="#0f172a">
  <meta name="robots" content="noindex, nofollow">
  
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'], display: ['"Outfit"', 'sans-serif'], mono: ['"Fira Code"', 'monospace'] },
          colors: { brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a', 950: '#0f172a' }, success: { 400: '#4ade80', 500: '#22c55e', 600: '#16a34a' }, warning: { 500: '#f59e0b' }, danger: { 500: '#ef4444' } }
        }
      }
    };
  </script>
  
  <style>
    body { background-color: #0f172a; color: #f8fafc; }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    .bg-grid { background-size: 40px 40px; background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px); }
    .glass-nav { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,255,255,0.08); }
    .glass-card { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); transition: all 0.3s ease; }
    .glass-card:hover { border-color: rgba(59, 130, 246, 0.3); box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5); }
    .sidebar-link.active { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border-left: 3px solid #60a5fa; font-weight: 700; }
    .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 8px; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; }
    .status-badge.active { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.2); }
    .status-badge.pending { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.2); }
    #toastContainer { position: fixed; top: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
    .toast { pointer-events: auto; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.1); border-left: 4px solid #3b82f6; padding: 16px 20px; border-radius: 12px; display: flex; align-items: center; gap: 12px; transform: translateX(120%); transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
    .toast.show { transform: translateX(0); }
    .toast.error { border-left-color: #ef4444; }
    .skeleton { background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 0.25rem; }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
  </style>
</head>
<body class="selection:bg-brand-500 selection:text-white">

  <div id="sysLoader" class="fixed inset-0 bg-slate-950 z-[200] flex flex-col items-center justify-center transition-opacity duration-500">
    <div class="w-16 h-16 border-4 border-slate-800 border-t-brand-500 rounded-full animate-spin mb-4"></div>
    <h2 class="text-white text-xl font-bold">PayGo OS</h2>
    <p class="text-slate-400 text-sm">A carregar infraestrutura...</p>
  </div>

  <div class="fixed inset-0 bg-grid opacity-20 pointer-events-none z-0"></div>
  <div class="fixed top-0 -left-4 w-[500px] h-[500px] bg-brand-600/10 rounded-full mix-blend-screen blur-[120px] pointer-events-none z-0"></div>
  <div id="toastContainer"></div>

  <header class="fixed w-full z-50 glass-nav">
    <div class="container mx-auto px-6 h-20 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="bg-gradient-to-tr from-brand-500 to-brand-400 p-2.5 rounded-xl text-white shadow-lg"><i data-lucide="zap" class="w-5 h-5"></i></div>
        <span class="text-2xl font-display font-bold text-white">PayGo</span>
        <span class="text-[10px] text-brand-400 ml-2 px-2 py-0.5 bg-brand-500/20 border border-brand-500/30 rounded-full font-black uppercase">OS Admin</span>
      </div>
      <div class="flex items-center gap-4">
        <div class="text-right hidden sm:block"><p class="text-sm font-bold text-white" id="adminName">Admin</p></div>
        <button onclick="window.logout()" class="bg-slate-800 hover:bg-danger-500/20 text-slate-400 hover:text-danger-400 border border-slate-700 rounded-xl p-2.5 transition-colors"><i data-lucide="power" class="w-5 h-5"></i></button>
      </div>
    </div>
  </header>

  <div class="pt-28 pb-10 relative z-10 container mx-auto px-6 grid lg:grid-cols-4 gap-6">
    
    <div class="lg:col-span-1">
      <div class="glass-card rounded-2xl p-6 sticky top-28">
        <nav class="space-y-2">
          <a href="dashboard.html" class="sidebar-link active flex items-center gap-3 px-4 py-3 rounded-xl text-white"><i data-lucide="activity" class="w-5 h-5"></i> <span class="text-sm font-medium">Visão Central</span></a>
          <a href="afiliados.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:text-white"><i data-lucide="network" class="w-5 h-5"></i> <span class="text-sm font-medium">Gestão de Parceiros</span></a>
          <a href="gerar-fatura.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:text-white"><i data-lucide="file-check-2" class="w-5 h-5"></i> <span class="text-sm font-medium">Faturas</span></a>
        </nav>
      </div>
    </div>

    <div class="lg:col-span-3 space-y-6">
      
      <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
        <div class="glass-card p-6 rounded-2xl">
          <i data-lucide="users" class="w-6 h-6 text-brand-400 mb-3"></i>
          <p class="text-3xl font-display font-bold text-white" id="statUsers"><span class="skeleton block w-12 h-8"></span></p>
          <p class="text-xs text-slate-400 mt-1 uppercase font-bold tracking-wider">Clientes Reg.</p>
        </div>
        <div class="glass-card p-6 rounded-2xl">
          <i data-lucide="shopping-bag" class="w-6 h-6 text-success-400 mb-3"></i>
          <p class="text-3xl font-display font-bold text-white" id="statOrders"><span class="skeleton block w-12 h-8"></span></p>
          <p class="text-xs text-slate-400 mt-1 uppercase font-bold tracking-wider">Pedidos Totais</p>
        </div>
        <div class="glass-card p-6 rounded-2xl border-brand-500/30 bg-brand-900/10">
          <i data-lucide="wallet" class="w-6 h-6 text-brand-300 mb-3"></i>
          <p class="text-3xl font-display font-bold text-white" id="statRevenue"><span class="skeleton block w-24 h-8"></span></p>
          <p class="text-xs text-brand-300 mt-1 uppercase font-bold tracking-wider">Volume Movimentado</p>
        </div>
      </div>

      <div class="glass-card rounded-2xl p-6">
        <div class="flex justify-between items-center mb-6">
          <h3 class="text-xl font-display font-bold text-white flex items-center gap-2"><i data-lucide="clock" class="w-5 h-5 text-warning-400"></i> Pedidos Recentes</h3>
        </div>
        <div class="overflow-x-auto border border-white/5 rounded-xl">
          <table class="w-full text-sm text-left">
            <thead class="bg-slate-800/50 text-[10px] uppercase text-slate-400">
              <tr><th class="py-4 px-5">ID</th><th class="py-4 px-5">Cliente</th><th class="py-4 px-5">Valor</th><th class="py-4 px-5">Status</th></tr>
            </thead>
            <tbody id="ordersTableBody" class="divide-y divide-white/5">
              <tr><td colspan="4" class="text-center py-6 text-slate-500"><div class="skeleton h-4 w-full"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAHxyX5e9O8qQo6Z3VHURgVXhxbxSp0Qh8",
      authDomain: "paygo-14311.firebaseapp.com",
      projectId: "paygo-14311",
      storageBucket: "paygo-14311.firebasestorage.app",
      messagingSenderId: "208360646277",
      appId: "1:208360646277:web:aecc57cc0077ae48a52bec"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app, "paygodb");

    lucide.createIcons();

    // Proteção de Loader (Força a ocultação em 3 segundos se falhar algo)
    const fallbackTimer = setTimeout(() => { document.getElementById('sysLoader').style.display = 'none'; }, 3000);

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = '../login.html'; return; }
      
      try {
        const userDoc = await getDoc(doc(db, "users", user.uid));
        if (userDoc.exists() && (userDoc.data().role === 'admin' || userDoc.data().role === 'superadmin')) {
          document.getElementById('adminName').textContent = userDoc.data().name || 'Admin';
          await fetchDashboardData();
        } else {
          window.location.href = '../index.html';
        }
      } catch (error) {
        console.error(error);
        showToast("Erro na ligação de segurança.", "error");
      } finally {
        clearTimeout(fallbackTimer);
        const ldr = document.getElementById('sysLoader');
        ldr.style.opacity = '0';
        setTimeout(() => ldr.style.display = 'none', 500);
      }
    });

    async function fetchDashboardData() {
      try {
        const usersSnap = await getDocs(collection(db, "users"));
        const ordersSnap = await getDocs(collection(db, "orders"));
        
        let totalUsers = 0;
        usersSnap.forEach(d => { if(d.data().role !== 'admin') totalUsers++; });
        
        let totalOrders = 0;
        let totalRevenue = 0;
        let ordersList = [];
        
        ordersSnap.forEach(d => {
          totalOrders++;
          if (d.data().status === 'completed' || d.data().isPaid) totalRevenue += d.data().total || 0;
          ordersList.push(d.data());
        });

        // Remover Skeletons
        document.getElementById('statUsers').textContent = totalUsers;
        document.getElementById('statOrders').textContent = totalOrders;
        document.getElementById('statRevenue').textContent = new Intl.NumberFormat('pt-MZ', { style: 'currency', currency: 'MZN' }).format(totalRevenue).replace('MZN', 'MT');

        // Tabela
        ordersList.sort((a,b) => (b.createdAt?.toDate() || 0) - (a.createdAt?.toDate() || 0));
        const tbody = document.getElementById('ordersTableBody');
        
        if(ordersList.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-slate-500">Sem pedidos.</td></tr>`;
        } else {
          tbody.innerHTML = ordersList.slice(0, 10).map(o => `
            <tr class="hover:bg-slate-800/40">
              <td class="py-3 px-5 font-mono text-xs text-brand-400">${o.orderId}</td>
              <td class="py-3 px-5 text-sm font-bold text-white">${o.name || o.email}</td>
              <td class="py-3 px-5 text-sm font-black text-slate-200">${o.total} MT</td>
              <td class="py-3 px-5"><span class="status-badge ${o.status || 'pending'}">${o.status}</span></td>
            </tr>
          `).join('');
        }
      } catch (error) {
        showToast('Erro ao ler base de dados.', 'error');
      }
    }

    window.logout = async function() { await signOut(auth); window.location.href = '../login.html'; };
    
    function showToast(msg, type = 'success') {
      const container = document.getElementById('toastContainer');
      const t = document.createElement('div');
      t.className = `toast border-l-4 ${type==='error'?'border-danger-500':'border-brand-500'}`;
      t.innerHTML = `<span class="text-sm font-bold text-white">${msg}</span>`;
      container.appendChild(t);
      requestAnimationFrame(() => t.classList.add('show'));
      setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 400); }, 4000);
    }
  </script>
</body>
</html>
