<!DOCTYPE html>
<html lang="pt-MZ" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auditoria Interna | PayGo Admin</title>
  <meta name="theme-color" content="#0f172a">
  <meta name="robots" content="noindex, nofollow">
  
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'], display: ['"Outfit"', 'sans-serif'], mono: ['"Fira Code"', 'monospace'] },
          colors: { brand: { 500: '#3b82f6', 600: '#2563eb', 950: '#0f172a' }, success: { 400: '#4ade80' }, warning: { 400: '#fbbf24' }, danger: { 400: '#f87171' } },
        }
      }
    };
  </script>
  
  <style>
    body { background-color: #0f172a; color: #f8fafc; }
    ::-webkit-scrollbar { width: 6px; height: 6px;} ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    .bg-grid { background-size: 40px 40px; background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px); }
    .glass-nav { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,255,255,0.08); }
    .glass-card { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
    
    .action-badge { padding: 4px 8px; border-radius: 6px; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; }
    .action-badge.update { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.2); }
    .action-badge.delete { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); }
    .action-badge.create { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.2); }
    
    /* Modal de Detalhes JSON */
    .modal { display: none; position: fixed; inset: 0; z-index: 10000; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; }
    .modal.active { display: flex; opacity: 1; }
    .modal-overlay { position: absolute; inset: 0; background: rgba(2, 6, 23, 0.8); backdrop-filter: blur(4px); }
    .modal-content { position: relative; background: #0f172a; border-radius: 20px; padding: 0; max-width: 800px; width: 95%; max-height: 90vh; overflow-y: auto; transform: scale(0.95); transition: transform 0.3s; border: 1px solid rgba(255,255,255,0.1); }
    .modal.active .modal-content { transform: scale(1); }
    
    .json-view { background: #020617; border-radius: 12px; padding: 16px; font-family: 'Fira Code', monospace; font-size: 12px; color: #a5b4fc; overflow-x: auto; border: 1px solid rgba(255,255,255,0.05); }
    .json-key { color: #7dd3fc; }
    .json-string { color: #86efac; }
  </style>
</head>
<body class="selection:bg-brand-500 selection:text-white">

  <div class="fixed inset-0 bg-grid opacity-20 pointer-events-none z-0"></div>

  <header class="fixed w-full z-50 glass-nav">
    <div class="container mx-auto px-6 h-20 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="bg-gradient-to-tr from-brand-500 to-brand-400 p-2.5 rounded-xl text-white"><i data-lucide="eye" class="w-5 h-5"></i></div>
        <div>
            <span class="text-xl font-display font-bold text-white">Auditoria da Equipa</span>
            <span class="text-[10px] text-danger-400 ml-2 px-2 py-0.5 bg-danger-500/10 border border-danger-500/20 rounded-full font-black uppercase tracking-widest">Caixa Negra</span>
        </div>
      </div>
      <a href="dashboard.html" class="flex items-center gap-2 text-sm font-bold text-slate-400 hover:text-white transition-colors bg-slate-800 px-4 py-2 rounded-lg border border-slate-700">
        <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Voltar ao Painel
      </a>
    </div>
  </header>

  <div class="pt-28 pb-10 relative z-10 container mx-auto px-4 max-w-6xl">
    <div class="glass-card rounded-2xl p-0 overflow-hidden shadow-lg border border-slate-800">
      <div class="overflow-x-auto min-h-[500px]">
        <table class="w-full text-sm text-left whitespace-nowrap">
          <thead class="bg-slate-900/80 text-[10px] uppercase text-slate-400 border-b border-white/5">
            <tr>
              <th class="py-4 px-6 font-bold">Data da Ação</th>
              <th class="py-4 px-6 font-bold">Membro da Equipa</th>
              <th class="py-4 px-6 font-bold">Ação Executada</th>
              <th class="py-4 px-6 font-bold">Alvo Afetado</th>
              <th class="py-4 px-6 text-right font-bold">Inspecionar</th>
            </tr>
          </thead>
          <tbody id="logsTableBody" class="divide-y divide-slate-800/50">
            <tr><td colspan="5" class="text-center py-12 text-slate-500"><i data-lucide="loader-2" class="w-8 h-8 animate-spin mx-auto mb-2"></i>A ler ficheiros protegidos...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="payloadModal" class="modal">
    <div class="modal-overlay" onclick="window.closeModal()"></div>
    <div class="modal-content flex flex-col h-full md:h-auto border border-slate-700">
      <div class="flex justify-between items-center p-5 border-b border-white/10 bg-slate-900 sticky top-0 z-10 rounded-t-[20px]">
        <h2 class="text-lg font-display font-bold text-white flex items-center gap-2"><i data-lucide="file-code" class="w-5 h-5 text-brand-400"></i> Detalhes da Ação</h2>
        <button onclick="window.closeModal()" class="text-slate-400 hover:text-white transition"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div class="p-6 bg-slate-950 flex-1">
        <div class="mb-4 flex flex-col gap-1 text-sm text-slate-400 border-b border-slate-800 pb-4">
            <p><strong class="text-slate-300">IP de Ligação:</strong> <span id="modalIp" class="font-mono"></span></p>
        </div>
        <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Dados Modificados (JSON)</p>
        <div class="json-view" id="jsonContainer">{}</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, query, orderBy, limit, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAHxyX5e9O8qQo6Z3VHURgVXhxbxSp0Qh8",
      authDomain: "paygo-14311.firebaseapp.com",
      projectId: "paygo-14311",
      storageBucket: "paygo-14311.firebasestorage.app",
      messagingSenderId: "208360646277",
      appId: "1:208360646277:web:aecc57cc0077ae48a52bec"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app, "paygodb");

    lucide.createIcons();
    let logsCache = [];

    // Proteção de Rota
    onAuthStateChanged(auth, async (user) => {
        if (!user) { window.location.href = 'login.html'; return; }
        const docSnap = await getDoc(doc(db, "users", user.uid));
        if (!docSnap.exists() || docSnap.data().role !== 'superadmin') {
            alert("Área Restrita Apenas a Super Administradores.");
            window.location.href = 'index.html';
        } else {
            startListeningLogs();
        }
    });

    function syntaxHighlight(json) {
        if (typeof json != 'string') json = JSON.stringify(json, undefined, 2);
        json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
            let cls = 'text-brand-300';
            if (/^"/.test(match)) { if (/:$/.test(match)) cls = 'json-key'; else cls = 'json-string'; }
            return '<span class="' + cls + '">' + match + '</span>';
        });
    }

    function startListeningLogs() {
        const q = query(collection(db, "admin_audit_logs"), orderBy("createdAt", "desc"), limit(100));
        onSnapshot(q, (snapshot) => {
            logsCache = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
            renderTable();
        });
    }

    function renderTable() {
        const tbody = document.getElementById('logsTableBody');
        if (logsCache.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-slate-500">Sem registos da equipa.</td></tr>`;
            return;
        }

        tbody.innerHTML = logsCache.map(log => {
            const dataStr = new Date(log.createdAt).toLocaleString('pt-MZ');
            
            let badgeClass = 'update'; let actionLabel = 'Modificação';
            if (log.action.includes('DELETE')) { badgeClass = 'delete'; actionLabel = 'Eliminação'; }
            if (log.action.includes('CREATE')) { badgeClass = 'create'; actionLabel = 'Criação'; }

            return `
            <tr class="hover:bg-slate-800/40 transition-colors border-b border-slate-800/50">
                <td class="py-4 px-6 text-slate-300 font-mono text-xs">${dataStr}</td>
                <td class="py-4 px-6 font-bold text-white">${log.adminName}</td>
                <td class="py-4 px-6"><span class="action-badge ${badgeClass}">${actionLabel}</span></td>
                <td class="py-4 px-6 text-brand-400 font-mono text-xs">${log.targetType.toUpperCase()}: ${log.targetId.substring(0,8)}...</td>
                <td class="py-4 px-6 text-right">
                    <button onclick="window.viewPayload('${log.id}')" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-bold border border-slate-700 inline-flex items-center gap-2">
                        <i data-lucide="braces" class="w-4 h-4"></i> Visualizar
                    </button>
                </td>
            </tr>`;
        }).join('');
        lucide.createIcons();
    }

    window.viewPayload = (id) => {
        const log = logsCache.find(l => l.id === id);
        if (!log) return;

        document.getElementById('jsonContainer').innerHTML = syntaxHighlight(log.details);
        document.getElementById('modalIp').textContent = log.ip || 'Desconhecido';

        const modal = document.getElementById('payloadModal');
        modal.style.display = 'flex';
        setTimeout(() => modal.classList.add('active'), 10);
    };

    window.closeModal = () => {
        const modal = document.getElementById('payloadModal');
        modal.classList.remove('active');
        setTimeout(() => modal.style.display = 'none', 300);
    };
  </script>
</body>
</html>
