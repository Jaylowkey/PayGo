<!DOCTYPE html>
<html lang="pt-MZ">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gerador de Faturas | Admin PayGo</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0f172a">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            display: ['"Outfit"', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: { 50: '#eff6ff', 100: '#dbeafe', 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 900: '#1e3a8a', 950: '#0f172a' },
            success: { 50: '#f0fdf4', 500: '#22c55e', 600: '#16a34a' },
            danger: { 50: '#fef2f2', 500: '#ef4444' }
          }
        }
      }
    };
  </script>
  
  <style>
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid #e2e8f0;
      border-radius: 1.5rem;
      box-shadow: 0 4px 20px -5px rgba(0,0,0,0.05);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass-card:hover { transform: translateY(-3px); box-shadow: 0 20px 40px -10px rgba(37, 99, 235, 0.15); }
    
    .btn-action {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }
    .btn-action:active { transform: scale(0.96); }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-in { animation: fadeIn 0.4s ease-out forwards; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased overflow-x-hidden">

<div id="pageLoader" class="fixed inset-0 bg-slate-950 z-[100] flex flex-col items-center justify-center">
  <div class="relative w-20 h-20">
    <div class="absolute inset-0 border-4 border-white/10 rounded-full"></div>
    <div class="absolute inset-0 border-4 border-t-brand-500 rounded-full animate-spin"></div>
  </div>
  <h2 class="text-white text-xl font-display font-bold mt-6 tracking-tight">PayGo Workspace</h2>
  <p class="text-slate-400 text-sm mt-2 font-medium animate-pulse">Sincronizando infraestrutura...</p>
</div>

<aside class="fixed left-0 top-0 h-full w-64 bg-slate-950 text-slate-300 hidden md:flex flex-col z-40 border-r border-white/5">
  <div class="p-6 border-b border-white/10 flex items-center gap-3">
    <div class="bg-brand-600 p-2 rounded-xl text-white shadow-lg">
      <i data-lucide="zap" class="w-5 h-5 fill-current text-yellow-300"></i>
    </div>
    <span class="text-xl font-display font-bold text-white">PayGo Admin</span>
  </div>
  
  <nav class="flex-1 p-4 space-y-2">
    <a href="#" class="flex items-center gap-3 px-4 py-3 bg-brand-500/10 text-brand-400 border-r-4 border-brand-500 rounded-xl font-bold">
      <i data-lucide="file-text" class="w-5 h-5"></i> Faturas
    </a>
    <a href="clientes.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-white/5 rounded-xl transition">
      <i data-lucide="users" class="w-5 h-5"></i> Clientes
    </a>
    <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-white/5 rounded-xl transition">
      <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard
    </a>
  </nav>

  <div class="p-4 mt-auto">
    <div class="bg-white/5 rounded-2xl p-4 border border-white/5">
      <div class="flex items-center gap-3 mb-3">
        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-brand-500 to-indigo-600 flex items-center justify-center text-white font-bold">A</div>
        <div>
          <p class="text-xs font-bold text-white">Admin Master</p>
          <p class="text-[10px] text-slate-500 uppercase tracking-tighter">Acesso Total</p>
        </div>
      </div>
    </div>
  </div>
</aside>

<main class="md:ml-64 p-4 md:p-10 min-h-screen">
  <div class="max-w-4xl mx-auto pt-16 md:pt-0">
    
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-10">
      <div>
        <h1 class="text-4xl font-display font-extrabold text-slate-900 tracking-tight">Gerador Pro</h1>
        <p class="text-slate-500 font-medium">Controle de emissão e envio automatizado.</p>
      </div>
      <div id="dbStatus" class="flex items-center gap-2 px-4 py-2 bg-slate-100 rounded-full text-[11px] font-black uppercase tracking-widest text-slate-500">
        <span class="w-2 h-2 rounded-full bg-slate-400 animate-pulse"></span> Offline
      </div>
    </div>

    <div class="glass-card p-2 mb-10">
      <div class="flex flex-col sm:flex-row gap-2">
        <div class="relative flex-1">
          <i data-lucide="search" class="absolute left-5 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
          <input type="text" id="orderIdInput" placeholder="ID DO PEDIDO (EX: PG-100)" 
            class="w-full pl-14 pr-4 py-5 bg-transparent border-none focus:ring-0 text-xl font-mono font-bold uppercase placeholder:text-slate-300">
        </div>
        <button onclick="searchOrder()" id="btnSearch" class="btn-action px-10 py-5 bg-slate-900 hover:bg-brand-600 text-white rounded-2xl font-bold flex items-center justify-center gap-2 shadow-xl shadow-slate-200 transition-all">
          <span>Localizar</span>
          <i data-lucide="arrow-right" class="w-5 h-5"></i>
        </button>
      </div>
    </div>

    <div id="resultContainer">
      <div id="emptyState" class="py-20 text-center">
        <div class="w-24 h-24 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-6">
          <i data-lucide="search" class="w-10 h-10 text-slate-300"></i>
        </div>
        <p class="text-slate-400 font-medium">Aguardando busca de pedido...</p>
      </div>
    </div>
  </div>
</main>

<div id="toastContainer" class="fixed bottom-6 right-6 z-[9999] space-y-3"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { initializeFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyAHxyX5e9O8qQo6Z3VHURgVXhxbxSp0Qh8",
    authDomain: "paygo-14311.firebaseapp.com",
    projectId: "paygo-14311",
    storageBucket: "paygo-14311.firebasestorage.app",
    messagingSenderId: "208360646277",
    appId: "1:208360646277:web:aecc57cc0077ae48a52bec"
  };

  let db;
  let currentOrder = null;

  // Inicialização Profissional
  async function initSystem() {
    try {
      const app = initializeApp(FIREBASE_CONFIG);
      // 🔥 CORREÇÃO CRÍTICA: Definindo o nome da base de dados explicitamente
      db = initializeFirestore(app, {
        experimentalForceLongPolling: true
      }, "paygo-14311");

      updateStatusUI('✅ Online', 'bg-success-500', 'text-success-600 bg-success-50');
      
      setTimeout(() => {
        const loader = document.getElementById('pageLoader');
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 500);
      }, 1000);
      
      lucide.createIcons();
    } catch (error) {
      console.error("Erro Crítico:", error);
      showToast("Falha na conexão com os servidores", "error");
    }
  }

  // --- Funções de Negócio ---

  window.searchOrder = async function() {
    const input = document.getElementById('orderIdInput');
    const id = input.value.trim().toUpperCase();
    const btn = document.getElementById('btnSearch');

    if (!id) return showToast("Por favor, digite um ID.", "warning");

    // Cache local para performance
    const cached = sessionStorage.getItem(`order_${id}`);
    if (cached) {
      renderResult(JSON.parse(cached));
      return showToast("Pedido carregado do cache", "success");
    }

    setBtnLoading(btn, true);

    try {
      const q = query(collection(db, "orders"), where("orderId", "==", id));
      const snap = await getDocs(q);

      if (snap.empty) {
        renderNotFound();
        showToast("Pedido não encontrado.", "error");
      } else {
        currentOrder = snap.docs[0].data();
        sessionStorage.setItem(`order_${id}`, JSON.stringify(currentOrder));
        renderResult(currentOrder);
        showToast("Dados recuperados!", "success");
      }
    } catch (e) {
      console.error(e);
      showToast("Erro ao acessar Firestore", "error");
    } finally {
      setBtnLoading(btn, false);
    }
  };

  function renderResult(order) {
    const container = document.getElementById('resultContainer');
    const isCompleted = order.status === 'completed';

    container.innerHTML = `
      <div class="glass-card p-8 animate-in">
        <div class="flex flex-col sm:flex-row justify-between border-b border-slate-100 pb-8 mb-8 gap-4">
          <div class="flex items-center gap-4">
            <div class="w-14 h-14 bg-brand-50 text-brand-600 rounded-2xl flex items-center justify-center">
              <i data-lucide="receipt-text" class="w-7 h-7"></i>
            </div>
            <div>
              <p class="text-xs font-black text-slate-400 uppercase tracking-widest">Código do Pedido</p>
              <h2 class="text-2xl font-display font-bold text-slate-900">${order.orderId}</h2>
            </div>
          </div>
          <div class="flex flex-col items-end">
             <span class="px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest ${isCompleted ? 'bg-success-50 text-success-600' : 'bg-amber-50 text-amber-600'}">
              ${isCompleted ? '✓ Concluído' : '• Pendente'}
             </span>
             <p class="text-[10px] text-slate-400 mt-2 font-mono">${new Date().toLocaleDateString()}</p>
          </div>
        </div>

        <div class="grid md:grid-cols-2 gap-10 mb-10">
          <div class="space-y-6">
            <h3 class="text-xs font-black text-slate-400 uppercase tracking-tighter flex items-center gap-2">
              <i data-lucide="user" class="w-4 h-4"></i> Titular da Conta
            </h3>
            <div class="bg-slate-50 rounded-2xl p-5 space-y-4 border border-slate-100">
              <div class="flex justify-between items-center text-sm">
                <span class="text-slate-500">Nome:</span>
                <span class="font-bold text-slate-800">${order.name || '---'}</span>
              </div>
              <div class="flex justify-between items-center text-sm">
                <span class="text-slate-500">Telefone:</span>
                <span class="font-bold text-slate-800">${order.whatsapp || '---'}</span>
              </div>
            </div>
          </div>

          <div class="space-y-6">
            <h3 class="text-xs font-black text-slate-400 uppercase tracking-tighter flex items-center gap-2">
              <i data-lucide="wallet" class="w-4 h-4"></i> Resumo Financeiro
            </h3>
            <div class="bg-slate-900 rounded-2xl p-5 text-white space-y-4">
              <div class="flex justify-between items-center text-sm opacity-80">
                <span>Valor Base:</span>
                <span>$${(order.usd || 0).toFixed(2)}</span>
              </div>
              <div class="flex justify-between items-center text-sm opacity-80">
                <span>Taxas:</span>
                <span>${formatCurrency(order.tax)}</span>
              </div>
              <div class="pt-3 border-t border-white/10 flex justify-between items-center">
                <span class="text-xs font-bold text-brand-400">TOTAL PAGO</span>
                <span class="text-2xl font-display font-black text-white">${formatCurrency(order.total)}</span>
              </div>
            </div>
          </div>
        </div>

        <div class="grid sm:grid-cols-2 gap-4">
          <button onclick="generatePDF()" class="btn-action flex items-center justify-center gap-3 bg-slate-100 hover:bg-slate-200 text-slate-900 py-5 rounded-2xl font-bold transition-all">
            <i data-lucide="download-cloud" class="w-5 h-5"></i> Baixar PDF
          </button>
          <button onclick="sendWhatsApp()" class="btn-action flex items-center justify-center gap-3 bg-[#25D366] hover:bg-[#1fb355] text-white py-5 rounded-2xl font-bold shadow-lg shadow-green-100 transition-all">
            <i data-lucide="send" class="w-5 h-5"></i> Enviar WhatsApp
          </button>
        </div>
      </div>
    `;
    lucide.createIcons();
  }

  window.sendWhatsApp = async function() {
    if (!currentOrder) return;
    
    showToast("Preparando integração...", "info");
    
    const doc = await buildInvoiceDoc(currentOrder);
    const pdfBase64 = doc.output('datauristring');
    
    // Formatação de número inteligente
    let phone = currentOrder.whatsapp.replace(/\D/g, '');
    if (phone.length === 9) phone = '258' + phone;

    try {
      const response = await fetch('/api/send-whatsapp-invoice', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          phone: phone,
          orderId: currentOrder.orderId,
          pdfData: pdfBase64
        })
      });

      if (response.ok) {
        showToast("Fatura entregue via API!", "success");
      } else {
        throw new Error();
      }
    } catch {
      // Fallback para Web Link
      const msg = encodeURIComponent(`Olá ${currentOrder.name}! Sua fatura PayGo do pedido ${currentOrder.orderId} está pronta. Verifique o PDF em anexo.`);
      window.open(`https://wa.me/${phone}?text=${msg}`, '_blank');
      doc.save(`Fatura_${currentOrder.orderId}.pdf`);
      showToast("Redirecionando para envio manual", "warning");
    }
  }

  // --- Utilitários ---

  async function buildInvoiceDoc(order) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    
    // Estilo Hiper Profissional para 2026
    doc.setFillColor(15, 23, 42);
    doc.rect(0, 0, 210, 50, 'F');
    
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(30);
    doc.text("PayGo", 20, 32);
    
    doc.setFontSize(10);
    doc.text("SISTEMA DE PAGAMENTOS DIGITAIS", 20, 42);
    
    // QR Code de validação
    const qr = await QRCode.toDataURL(`https://paygo.co.mz/v/${order.orderId}`);
    doc.addImage(qr, 'PNG', 165, 10, 30, 30);

    doc.setTextColor(15, 23, 42);
    doc.setFontSize(12);
    doc.text(`FATURA # ${order.orderId}`, 20, 70);
    doc.text(`CLIENTE: ${order.name}`, 20, 78);

    doc.autoTable({
      startY: 90,
      head: [['ITEM', 'REF', 'VALOR USD', 'TOTAL MT']],
      body: [[
        'SERVIÇO DE INTERMEDIAÇÃO',
        order.orderId,
        `$${order.usd.toFixed(2)}`,
        formatCurrency(order.total)
      ]],
      headStyles: { fillColor: [37, 99, 235] }
    });

    return doc;
  }

  function formatCurrency(val) {
    return new Intl.NumberFormat('pt-MZ', { style: 'currency', currency: 'MZN' }).format(val || 0).replace('MZN', 'MT');
  }

  function updateStatusUI(text, dotColor, bgClass) {
    const el = document.getElementById('dbStatus');
    el.className = `flex items-center gap-2 px-4 py-2 rounded-full text-[11px] font-black uppercase tracking-widest ${bgClass}`;
    el.innerHTML = `<span class="w-2 h-2 rounded-full ${dotColor}"></span> ${text}`;
  }

  function showToast(msg, type) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    const colors = {
      error: 'bg-red-600',
      success: 'bg-slate-900',
      warning: 'bg-amber-500',
      info: 'bg-brand-600'
    };
    
    toast.className = `px-6 py-4 rounded-2xl text-white font-bold shadow-2xl flex items-center gap-3 transform transition-all duration-300 translate-y-20 opacity-0 ${colors[type] || colors.success}`;
    toast.innerHTML = `<i data-lucide="info" class="w-5 h-5"></i> ${msg}`;
    
    container.appendChild(toast);
    lucide.createIcons({ root: toast });
    
    setTimeout(() => {
      toast.classList.remove('translate-y-20', 'opacity-0');
    }, 10);
    
    setTimeout(() => {
      toast.classList.add('opacity-0', 'translate-x-10');
      setTimeout(() => toast.remove(), 400);
    }, 4000);
  }

  function setBtnLoading(btn, isLoading) {
    btn.disabled = isLoading;
    btn.style.opacity = isLoading ? '0.7' : '1';
    btn.innerHTML = isLoading ? '<div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>' : '<span>Localizar</span><i data-lucide="arrow-right" class="w-5 h-5"></i>';
    lucide.createIcons();
  }

  function renderNotFound() {
    document.getElementById('resultContainer').innerHTML = `
      <div class="glass-card p-12 text-center animate-in border-red-100">
        <i data-lucide="alert-circle" class="w-16 h-16 text-red-400 mx-auto mb-4"></i>
        <h3 class="text-xl font-bold text-slate-900">Pedido Inexistente</h3>
        <p class="text-slate-500">Não encontramos nenhum registro para este código.</p>
      </div>
    `;
    lucide.createIcons();
  }

  window.generatePDF = async function() {
    if(!currentOrder) return;
    const doc = await buildInvoiceDoc(currentOrder);
    doc.save(`FATURA_${currentOrder.orderId}.pdf`);
    showToast("PDF Gerado!", "success");
  }

  // Atalhos
  document.addEventListener('keypress', e => { if(e.key === 'Enter') searchOrder(); });

  initSystem();
</script>
</body>
</html>
