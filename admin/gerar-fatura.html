  // ==========================================

  async function initFirebase() {
    console.log('🔥 Tentando conectar ao Firebase...');
    
    try {
      const app = initializeApp(FIREBASE_CONFIG);
      
      // ✅ CORREÇÃO CRÍTICA: Sem "paygodb" - Firestore usa apenas (default)
      db = getFirestore(app);
      
      // ⚠️ IMPORTANTE: A inicialização NÃO lança erro mesmo se o banco não existir
      // Precisamos fazer um teste REAL de conexão
      
      console.log('🔍 Testando conexão real com Firestore...');
      
      // Teste real: tentar buscar algo (mesmo que não exista)
      // Se o banco não existir, isso LANÇARÁ o erro "not-found"
      await getDocs(collection(db, '_connection_test_')).catch(err => {
        // Se for erro de banco não existente, relançar para ser capturado
        if (err.code === 'not-found' || err.message?.includes('does not exist')) {
          throw err;
        }
        // Outros erros (como permissão) são esperados e não indicam falta de banco
        return null;
      });
      
      // ✅ Se chegou aqui, conexão FUNCIONOU
      firestoreAvailable = true;
      demoMode = false;
      
      console.log('✅ Firestore conectado COM SUCESSO');
      showConnectionStatus('✅ Conectado ao Firestore', 'success');
      return true;
      
    } catch (error) {
      console.warn('⚠️ Firestore NÃO disponível:', error.code, error.message);
      
      // ❌ CONEXÃO FALHOU - atualizar estado REAL
      firestoreAvailable = false;
      demoMode = true;
      
      // Mensagens específicas por tipo de erro
      if (error.code === 'not-found' || error.message?.includes('does not exist')) {
        console.warn('📋 Banco Firestore NÃO criado ou nome incorreto. Ativando MODO DEMO.');
        showConnectionStatus('🔧 Modo Demo: Verifique se o banco "(default)" está criado', 'warning');
        showDemoNotice();
        return false;
      }
      
      if (error.message?.includes('requires billing')) {
        console.warn('💳 Billing não ativado. Ativando MODO DEMO.');
        showConnectionStatus('💳 Ative o billing em console.cloud.google.com', 'warning');
        showDemoNoticeWithBillingLink();
        return false;
      }
      
      // Outros erros de conexão
      console.warn('📡 Problema de conexão. Modo offline ativado.');
      showConnectionStatus('⚠️ Conexão instável: Usando dados locais', 'warning');
      showDemoNotice();
      return false;
    }
  }

  // ==========================================
  // 🔔 SISTEMA DE TOAST NOTIFICATIONS
  // ==========================================
  function showToast(message, type = 'success', duration = 4000) {
    const container = document.getElementById('toast-container');
    if (!container) return;
    
    const toast = document.createElement('div');
    toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg text-white transform transition-all duration-300 translate-x-full ${
      type === 'error' ? 'bg-red-500' : 
      type === 'warning' ? 'bg-amber-500' : 
      type === 'info' ? 'bg-blue-500' : 
      'bg-green-500'
    }`;
    toast.setAttribute('role', 'alert');
    toast.setAttribute('aria-live', 'assertive');
    
    const icons = {
      success: 'check-circle',
      error: 'alert-circle',
      warning: 'alert-triangle',
      info: 'info'
    };
    const icon = icons[type] || icons.success;
    
    toast.innerHTML = `
      <i data-lucide="${icon}" class="w-5 h-5 flex-shrink-0" aria-hidden="true"></i>
      <span class="text-sm font-medium">${message}</span>
      <button onclick="this.parentElement.remove()" class="ml-2 hover:opacity-80 focus:outline-none" aria-label="Fechar">
        <i data-lucide="x" class="w-4 h-4" aria-hidden="true"></i>
      </button>
    `;
    
    container.appendChild(toast);
    
    if (typeof lucide !== 'undefined') {
      try { lucide.createIcons({ root: toast }); } catch(e) {}
    }
    
    requestAnimationFrame(() => {
      toast.classList.remove('translate-x-full');
    });
    
    setTimeout(() => {
      toast.classList.add('opacity-0');
      setTimeout(() => toast.remove(), 300);
    }, duration);
  }

  // ==========================================
  // 📊 STATUS AREA UPDATES
  // ==========================================
  function showStatus(msg, type) {
    const area = document.getElementById('statusArea');
    if (!area) return;
    
    area.className = 'mt-6 p-4 rounded-xl border text-sm font-medium flex items-start gap-3';
    
    if (type === 'error') {
      area.classList.add('bg-red-50', 'text-red-700', 'border-red-200');
    } else if (type === 'info') {
      area.classList.add('bg-blue-50', 'text-blue-700', 'border-blue-200');
    } else if (type === 'warning') {
      area.classList.add('bg-amber-50', 'text-amber-700', 'border-amber-200');
    } else {
      area.classList.add('bg-green-50', 'text-green-700', 'border-green-200');
    }
    
    const icons = {
      success: 'check-circle-2',
      error: 'alert-circle',
      info: 'loader-2',
      warning: 'alert-triangle'
    };
    const icon = icons[type] || icons.success;
    const spin = type === 'info' ? 'animate-spin' : '';
    
    area.innerHTML = `
      <i data-lucide="${icon}" class="w-5 h-5 flex-shrink-0 ${spin}" aria-hidden="true"></i>
      <span>${msg}</span>
    `;
    
    if (typeof lucide !== 'undefined') {
      try { lucide.createIcons({ root: area }); } catch(e) {}
    }
    
    area.classList.remove('hidden');
  }

    const icons = {
      success: 'check-circle',
      info: 'info',
      warning: 'wifi-off',

    }
    
    // Auto-hide após 10 segundos para warnings/info/success

    }
  }

  // ==========================================
  // 💾 BUSCAR PEDIDO (Com fallback demo REAL)
  // ==========================================
  async function fetchOrderData(orderId) {
    // Se em modo demo OU Firestore indisponível, usar dados de exemplo
    if (demoMode || !firestoreAvailable) {
      console.log('📋 Usando dados de exemplo para:', orderId);
      await new Promise(resolve => setTimeout(resolve, 800)); // Simular delay
      
      const demoOrder = DEMO_ORDERS[orderId];
      if (demoOrder) {
        return { ...demoOrder, isDemo: true };
      }
      return null;
    }
    
    // Tentar buscar no Firestore real
    try {
      console.log('🔍 Buscando pedido no Firestore:', orderId);
      
      const q = query(collection(db, "orders"), where("orderId", "==", orderId));
      const snap = await getDocs(q);
      
      if (snap.empty) {
        return null;
      }
      
      const docSnap = snap.docs[0];
      return { id: docSnap.id, ...docSnap.data() };
      
    } catch (error) {
      console.error('❌ Erro ao buscar no Firestore:', error);
      
      // Fallback para modo demo se falhar
      if (!demoMode) {
        console.warn('⚠️ Ativando modo demo após erro');
        demoMode = true;
        firestoreAvailable = false;
        showConnectionStatus('Erro de conexão: Usando dados de exemplo', 'warning');
        showDemoNotice();
        return fetchOrderData(orderId); // Recursivo para usar demo
      }
      
      throw error;
    }
  }

  // ==========================================
  // 📄 GERAR PDF DA FATURA (com watermark DEMO)
  // ==========================================
  async function generatePDF(order) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({
      orientation: 'portrait',
      unit: 'mm',
      format: 'a4'
    });
    
    // Cores
    const brandColor = [59, 130, 246];
    const darkColor = [15, 23, 42];
    const grayColor = [100, 116, 139];
    
    // Formatadores
    const formatDate = (dateValue) => {
      if (!dateValue) return new Date().toLocaleDateString('pt-MZ');
      const date = dateValue?.toDate ? dateValue.toDate() : new Date(dateValue);
      return date.toLocaleDateString('pt-MZ', { 
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    };
    
    const formatMoney = (val) => {
      return Number(val || 0).toLocaleString('pt-MZ', { 
        minimumFractionDigits: 2, 
        maximumFractionDigits: 2 
      }) + ' MT';
    };
    
    // Cálculos
    const convertedValue = (order.usd || 0) * (order.exchangeRate || 88);
    const isFreeTax = (order.tax || 0) === 0;
    const orderDate = formatDate(order.createdAt);
    
    // HEADER
    doc.setFillColor(...darkColor);
    doc.rect(0, 0, 210, 45, 'F');
    
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(26);
    doc.setFont("helvetica", "bold");
    doc.text("PayGo", 14, 25);
    
    doc.setFontSize(10);
    doc.setFont("helvetica", "normal");
    doc.text("O Mundo no seu Bolso.", 50, 25);
    
    // QR Code
    const validationUrl = `https://paygo.co.mz/validar?id=${order.orderId}`;
    try {
      const qrDataUrl = await QRCode.toDataURL(validationUrl, { 
        errorCorrectionLevel: 'H', 
        margin: 0,
        color: { dark: '#ffffff', light: '#0f172a' } 
      });
      doc.addImage(qrDataUrl, 'PNG', 170, 10, 22, 22);
    } catch (e) {
      console.warn('⚠️ QR Code não gerado:', e);
      doc.setFontSize(6);
      doc.text("Validar: " + validationUrl, 170, 35, { maxWidth: 30 });
    }
    
    doc.setFontSize(7);
    doc.setFont("helvetica", "bold");
    doc.text("DOCUMENTO OFICIAL", 181, 37, null, null, "center");
    
    // EMPRESA
    doc.setTextColor(...darkColor);
    doc.setFontSize(10);
    doc.setFont("helvetica", "bold");
    doc.text("PayGo Serviços Digitais", 14, 60);
    
    doc.setFont("helvetica", "normal");
    doc.setTextColor(...grayColor);
    doc.text("Rua de Bárue, Centro Comercial MK", 14, 66);
    doc.text("Loja nº 6 - Chimoio, Moçambique", 14, 72);
    doc.text("Email: contact@paygo.co.mz", 14, 78);
    doc.text("WhatsApp: +258 83 752 2255", 14, 84);
    
    // CLIENTE
    doc.setTextColor(...darkColor);
    doc.setFont("helvetica", "bold");
    doc.text("Faturado a:", 120, 60);
    
    doc.setFont("helvetica", "normal");
    doc.setTextColor(...grayColor);
    doc.text(order.name || "Cliente Não Identificado", 120, 66);
    doc.text(order.whatsapp || "N/A", 120, 72);
    doc.text(order.email || "N/A", 120, 78);
    
    // DETALHES DO PEDIDO
    doc.setTextColor(...darkColor);
    doc.setFont("helvetica", "bold");
    doc.text("Detalhes do Pedido:", 120, 92);
    
    doc.setFont("helvetica", "normal");
    doc.setTextColor(...grayColor);
    doc.text(`Nº do Pedido: ${order.orderId}`, 120, 98);
    doc.text(`Data: ${orderDate}`, 120, 104);
    doc.text(`Método: ${order.paymentMethod === 'mpesa' ? 'M-Pesa' : 'e-Mola'}`, 120, 110);
    
    // TABELA
    doc.autoTable({
      startY: 120,
      head: [['Descrição', 'Câmbio', 'Valor Original', 'Total (MT)']],
      body: [
        [
          `Serviço de Intermediação\nRef: ${(order.detail || "Produto não especificado").substring(0, 50)}${(order.detail?.length > 50) ? '...' : ''}`,
          `${(order.exchangeRate || 88).toFixed(2)} MT / USD`,
          `$${(order.usd || 0).toFixed(2)} USD`,
          formatMoney(convertedValue)
        ]
      ],
      theme: 'striped',
      headStyles: { 
        fillColor: brandColor, 
        textColor: 255,
        fontSize: 9,
        fontStyle: 'bold'
      },
      styles: { 
        font: 'helvetica', 
        fontSize: 9, 
        cellPadding: 5,
        lineColor: [226, 232, 240],
        lineWidth: 0.3
      },
      columnStyles: { 
        0: { cellWidth: 90 },
        1: { cellWidth: 35, halign: 'center' },
        2: { cellWidth: 35, halign: 'center' },
        3: { cellWidth: 40, halign: 'right', fontStyle: 'bold' }
      }
    });
    
    // RESUMO FINANCEIRO
    let finalY = doc.lastAutoTable.finalY + 20;
    
    doc.setTextColor(...grayColor);
    doc.setFontSize(10);
    doc.setFont("helvetica", "normal");
    
    doc.text("Subtotal:", 140, finalY);
    doc.text("Taxa de Serviço:", 140, finalY + 8);
    
    doc.setTextColor(...darkColor);
    doc.setFont("helvetica", "bold");
    doc.text(formatMoney(convertedValue), 195, finalY, null, null, "right");
    doc.text(isFreeTax ? "GRÁTIS" : formatMoney(order.tax), 195, finalY + 8, null, null, "right");
    
    doc.setDrawColor(226, 232, 240);
    doc.setLineWidth(0.5);
    doc.line(140, finalY + 12, 195, finalY + 12);
    
    // TOTAL
    doc.setFontSize(14);
    doc.setTextColor(...brandColor);
    doc.text("TOTAL:", 140, finalY + 24);
    doc.text(formatMoney(order.total), 195, finalY + 24, null, null, "right");
    
    // RODAPÉ
    finalY += 40;
    
    doc.setFillColor(...brandColor);
    doc.roundedRect(14, finalY, 182, 25, 3, 3, 'F');
    
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(9);
    doc.setFont("helvetica", "bold");
    doc.text("✅ Documento Oficial PayGo", 105, finalY + 10, null, null, "center");
    
    doc.setFontSize(8);
    doc.setFont("helvetica", "normal");
    doc.text(`Validação: ${validationUrl}`, 105, finalY + 17, null, null, "center");
    
    // ✅ WATERMARK "DEMO" se for modo demonstração
    if (order.isDemo) {
      doc.setTextColor(239, 68, 68);
      doc.setFontSize(48);
      doc.setFont("helvetica", "bold");
      doc.text("DEMO", 105, 150, null, null, "center");
      doc.setGAlpha(0.1);
    }
    
    // Page number
    const pageCount = doc.internal.getNumberOfPages();
    doc.setFontSize(8);
    doc.setTextColor(...grayColor);
    doc.text(`Página 1 de ${pageCount}`, 105, 290, null, null, "center");
    
    return doc;
  }

  // ==========================================
  // 📤 ENVIAR VIA WHATSAPP (Com fallback)
  // ==========================================
  async function sendToEvolutionApi(order, base64Pdf) {
    showStatus('🔄 Conectando ao servidor...', 'info');
    
    try {
      const ADMIN_SECRET = "PayGo@Admin#2026!Sec";
      
      const response = await fetch('/api/send-whatsapp-invoice', {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json',
          'x-admin-secret': ADMIN_SECRET
        },
        body: JSON.stringify({
          orderId: order.orderId,
          clientName: order.name,
          phone: order.whatsapp,
          pdfData: base64Pdf,
          timestamp: new Date().toISOString()
        })
      });
      
      const result = await response.json();
      
      if (response.ok && result.success) {
        showToast('✅ Fatura enviada com sucesso!', 'success', 6000);
        showStatus('Fatura enviada para WhatsApp do cliente.', 'success');
        return true;
      } else {
        throw new Error(result.error || 'Erro na API.');
      }
      
    } catch (err) {
      console.error('❌ Erro ao enviar WhatsApp:', err);
      
      // Fallback: abrir WhatsApp manualmente
      const message = encodeURIComponent(
        `Olá ${order.name || 'Cliente'},\n\nSua fatura PayGo #${order.orderId} está pronta!\n\nTotal: ${formatMoney(order.total)}\n\nPor favor, confirme o recebimento. 🙏`
      );
      const phone = order.whatsapp?.replace(/\D/g, '') || '';
      
      if (phone) {
        const cleanPhone = phone.startsWith('258') ? phone : `258${phone}`;
        window.open(`https://wa.me/${cleanPhone}?text=${message}`, '_blank', 'noopener,noreferrer');
        showStatus('⚠️ Abrindo WhatsApp manualmente. Baixe o PDF acima.', 'warning');
        showToast('📱 WhatsApp aberto. Envie o PDF manualmente.', 'info');
      } else {
        throw new Error('Número de WhatsApp não encontrado.');
      }
    }
  }

  // ==========================================
  // 🎯 FUNÇÃO PRINCIPAL: PROCESSAR FATURA
  // ==========================================
  window.processInvoice = async function(action) {
    const btnDown = document.getElementById('btnGenerate');
    const btnWa = document.getElementById('btnSendWa');
    const input = document.getElementById('orderIdInput');
    const orderId = input?.value.trim().toUpperCase();
    const statusArea = document.getElementById('statusArea');
    
    // Validação do ID
    if (!orderId || !/^PG-\d{6}$/.test(orderId)) {
      showStatus('⚠️ Insira um ID válido (ex: PG-123456)', 'error');
      showToast('ID do pedido inválido', 'error');
      input?.focus();
      return;
    }
    
    // Estado de loading
    const activeBtn = action === 'download' ? btnDown : btnWa;
    const originalHtml = activeBtn?.innerHTML;
    
    if (activeBtn) {
      activeBtn.disabled = true;
      activeBtn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Processando<span class="loading-dots"></span>';
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }
    
    statusArea?.classList.add('hidden');
    
    try {
      // 1. Buscar dados do pedido
      showStatus('🔍 Buscando pedido no sistema...', 'info');
      const orderData = await fetchOrderData(orderId);
      
      if (!orderData) {
        showStatus(`❌ Pedido ${orderId} não encontrado.`, 'error');
        showToast('Pedido não encontrado', 'error');
        
        // Sugestão em modo demo
        if (demoMode) {
          showStatus('💡 Em modo demo, tente: PG-145340 ou PG-999999', 'info');
        }
        return;
      }
      
      // Mostrar aviso se for demo
      if (orderData.isDemo) {
        showDemoNotice();
        showToast('📋 Usando dados de exemplo (modo demo)', 'info', 6000);
      }
      
      // 2. Gerar PDF
      showStatus('📄 Gerando fatura PDF...', 'info');
      const doc = await generatePDF(orderData);
      
      // 3. Ação solicitada
      if (action === 'download') {
        const fileName = `Fatura_PayGo_${orderData.orderId}.pdf`;
        doc.save(fileName);
        showStatus(`✅ Fatura "${fileName}" baixada com sucesso!`, 'success');
        showToast('Fatura baixada!', 'success');
        
      } else if (action === 'whatsapp') {
        showStatus('📤 Preparando envio para WhatsApp...', 'info');
        const pdfBase64 = doc.output('datauristring');
        await sendToEvolutionApi(orderData, pdfBase64);
      }
      
    } catch (error) {
      console.error('❌ Erro no processInvoice:', error);
      showStatus(`❌ Erro: ${error.message || 'Tente novamente'}`, 'error');
      showToast('Erro ao processar fatura', 'error');
    } finally {
      // Resetar botões
      if (activeBtn && originalHtml) {
        activeBtn.disabled = false;
        activeBtn.innerHTML = originalHtml;
        if (typeof lucide !== 'undefined') lucide.createIcons();
      }
    }
  };

  // Helper para formatar dinheiro
  function formatMoney(val) {
    return Number(val || 0).toLocaleString('pt-MZ', { 
      minimumFractionDigits: 2, 
      maximumFractionDigits: 2 
    }) + ' MT';
  }

  // ==========================================
  // 🚀 INICIALIZAÇÃO DA PÁGINA
  // ==========================================
  document.addEventListener('DOMContentLoaded', async function() {
    // Inicializar ícones Lucide
    if (typeof lucide !== 'undefined') {
      lucide.createIcons();
      console.log('✅ Lucide icons initialized');
    }
    
    // Inicializar Firebase (com status REAL)
    await initFirebase();
    
    // Auto-focus no input de ID
    const orderIdInput = document.getElementById('orderIdInput');
    if (orderIdInput) {
      orderIdInput.focus();
      
      // Format input: PG-XXXXXX
      orderIdInput.addEventListener('input', function(e) {
        let value = e.target.value.toUpperCase().replace(/[^PG-\d]/g, '');
        if (value && !value.startsWith('PG-')) {
          value = 'PG-' + value.replace('PG-', '');
        }
        if (value.length > 10) value = value.slice(0, 10);
        e.target.value = value;
      });
      
      // Submit com Enter
      orderIdInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          processInvoice('download');
        }
      });
    }
    
    // Mostrar aviso de demo se aplicável
    if (demoMode) {
      showDemoNotice();
    }
    
    // ✅ LOGS CORRETOS com estado REAL
    console.log('✅ PayGo Invoice Generator loaded');
    console.log('📊 Firestore:', firestoreAvailable ? '✅ Conectado' : '❌ Offline');
    console.log('🎭 Demo mode:', demoMode ? '✅ Ativo' : '❌ Inativo');
  });

  // Expor funções para debug
  window.PayGoInvoice = {
    showToast,
    showStatus,
    fetchOrderData,
    generatePDF,
    demoMode: () => demoMode,
    firestoreAvailable: () => firestoreAvailable
  };
</script>
