<!DOCTYPE html>
<html lang="pt-MZ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Faturas | Admin PayGo</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a', 950: '#0f172a' },
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex">

    <aside class="w-64 bg-slate-950 text-slate-300 hidden md:flex flex-col">
        <div class="p-6 border-b border-white/10 flex items-center gap-3">
            <div class="bg-brand-500 p-2 rounded-lg text-white"><i data-lucide="zap" class="w-5 h-5"></i></div>
            <span class="text-xl font-bold text-white">PayGo Admin</span>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="#" class="flex items-center gap-3 p-3 rounded-lg hover:bg-white/5 transition"><i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard</a>
            <a href="#" class="flex items-center gap-3 p-3 rounded-lg bg-brand-500/10 text-brand-400 border border-brand-500/20 transition"><i data-lucide="file-text" class="w-5 h-5"></i> Faturas & Envios</a>
        </nav>
    </aside>

    <main class="flex-1 p-8 flex flex-col items-center justify-center relative overflow-hidden">
        <div class="absolute top-0 right-0 w-96 h-96 bg-brand-500/10 rounded-full blur-[100px] pointer-events-none"></div>

        <div class="w-full max-w-lg bg-white p-8 rounded-3xl shadow-xl border border-slate-100 relative z-10">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-brand-50 text-brand-600 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-brand-100 shadow-inner">
                    <i data-lucide="file-check-2" class="w-8 h-8"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-900">Emissão de Faturas</h1>
                <p class="text-slate-500 text-sm mt-1">Gere o PDF validado e envie direto para o cliente.</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">ID do Pedido (Ex: PG-123456)</label>
                    <div class="relative">
                        <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                        <input type="text" id="orderIdInput" class="w-full pl-12 pr-4 py-4 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition-all font-mono font-bold uppercase text-lg" placeholder="PG-">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <button id="btnGenerate" onclick="processInvoice('download')" class="w-full bg-slate-100 text-slate-700 py-4 rounded-xl font-bold hover:bg-slate-200 transition-all flex items-center justify-center gap-2 shadow-sm active:scale-95">
                        <i data-lucide="download" class="w-5 h-5"></i>
                        <span>Baixar PDF</span>
                    </button>
                    <button id="btnSendWa" onclick="processInvoice('whatsapp')" class="w-full bg-green-500 text-white py-4 rounded-xl font-bold hover:bg-green-600 transition-all flex items-center justify-center gap-2 shadow-lg shadow-green-500/30 active:scale-95">
                        <i data-lucide="send" class="w-5 h-5"></i>
                        <span>Enviar WhatsApp</span>
                    </button>
                </div>
            </div>

            <div id="statusArea" class="mt-6 hidden p-4 rounded-xl border text-sm font-medium"></div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyAHxyX5e9O8qQo6Z3VHURgVXhxbxSp0Qh8",
            authDomain: "paygo-14311.firebaseapp.com",
            projectId: "paygo-14311"
        };

        const app = initializeApp(FIREBASE_CONFIG);
        const db = getFirestore(app);

        lucide.createIcons();

        // Variável global para guardar o base64 do último PDF gerado
        let lastPdfBase64 = null;

        window.processInvoice = async function(action) {
            const btnDown = document.getElementById('btnGenerate');
            const btnWa = document.getElementById('btnSendWa');
            const input = document.getElementById('orderIdInput').value.trim().toUpperCase();
            const statusArea = document.getElementById('statusArea');

            if (!input) { showStatus('Insira o ID do Pedido.', 'error'); return; }

            // Loading state
            const activeBtn = action === 'download' ? btnDown : btnWa;
            const originalHtml = activeBtn.innerHTML;
            activeBtn.disabled = true;
            activeBtn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Processando...';
            lucide.createIcons();
            statusArea.classList.add('hidden');

            try {
                const q = query(collection(db, "orders"), where("orderId", "==", input));
                const snap = await getDocs(q);

                if (snap.empty) {
                    showStatus(`Pedido ${input} não encontrado.`, 'error');
                    return;
                }

                const orderData = snap.docs[0].data();
                
                // Gerar o PDF com QR Code (Retorna o documento jsPDF)
                const doc = await generatePDF(orderData);
                
                if (action === 'download') {
                    doc.save(`Fatura_PayGo_${orderData.orderId}.pdf`);
                    showStatus(`Fatura baixada com sucesso!`, 'success');
                } else if (action === 'whatsapp') {
                    // Converter PDF para Base64 para enviar para a API Node.js
                    const pdfBase64 = doc.output('datauristring');
                    await sendToEvolutionApi(orderData, pdfBase64);
                }

            } catch (error) {
                console.error("Erro:", error);
                showStatus('Falha ao processar operação.', 'error');
            } finally {
                activeBtn.disabled = false;
                activeBtn.innerHTML = originalHtml;
                lucide.createIcons();
            }
        };

        async function generatePDF(order) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            const brandColor = [59, 130, 246]; 
            const darkColor = [15, 23, 42];    
            const grayColor = [100, 116, 139]; 

            const dateStr = order.createdAt?.toDate ? order.createdAt.toDate().toLocaleDateString('pt-MZ') : new Date().toLocaleDateString('pt-MZ');
            const formatMoney = (val) => Number(val).toLocaleString('pt-MZ', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' MT';
            
            const convertedValue = (order.usd * order.exchangeRate);
            const isFreeTax = order.tax === 0;

            // --- CABEÇALHO ---
            doc.setFillColor(...darkColor);
            doc.rect(0, 0, 210, 45, 'F');

            doc.setTextColor(255, 255, 255);
            doc.setFontSize(26);
            doc.setFont("helvetica", "bold");
            doc.text("PayGo", 14, 25);
            doc.setFontSize(10);
            doc.setFont("helvetica", "normal");
            doc.text("O Mundo no seu Bolso.", 50, 25);

            // --- GERAR QR CODE ANTI-FRAUDE ---
            const validationUrl = `https://paygo.co.mz/validar?id=${order.orderId}`;
            const qrDataUrl = await QRCode.toDataURL(validationUrl, { 
                errorCorrectionLevel: 'H', 
                margin: 0,
                color: { dark: '#ffffff', light: '#0f172a' } // Cores que combinam com o header
            });
            
            // Adicionar QR Code no header
            doc.addImage(qrDataUrl, 'PNG', 170, 10, 22, 22);
            doc.setFontSize(7);
            doc.setFont("helvetica", "bold");
            doc.text("DOCUMENTO OFICIAL", 181, 37, null, null, "center");

            // --- INFORMAÇÕES ---
            doc.setTextColor(...darkColor);
            doc.setFontSize(10);
            
            doc.setFont("helvetica", "bold");
            doc.text("PayGo Serviços Digitais", 14, 60);
            doc.setFont("helvetica", "normal");
            doc.setTextColor(...grayColor);
            doc.text("Rua de Bárue, Centro Comercial MK", 14, 66);
            doc.text("Loja nº 6 - Chimoio, Moçambique", 14, 72);
            doc.text("Email: contact@paygo.co.mz", 14, 78);

            doc.setTextColor(...darkColor);
            doc.setFont("helvetica", "bold");
            doc.text("Faturado a:", 120, 60);
            doc.text("Detalhes do Pedido:", 120, 78);
            
            doc.setFont("helvetica", "normal");
            doc.setTextColor(...grayColor);
            doc.text(order.name, 120, 66);
            doc.text(order.whatsapp, 120, 72);
            
            doc.text(`Nº do Pedido: ${order.orderId}`, 120, 84);
            doc.text(`Data: ${dateStr}`, 120, 90);

            // --- TABELA ---
            doc.autoTable({
                startY: 105,
                head: [['Descrição', 'Câmbio', 'Valor Original', 'Total (MT)']],
                body: [
                    [
                        `Serviço de Intermediação\nRef: ${order.detail.substring(0, 45)}...`,
                        `${order.exchangeRate.toFixed(2)} MT / USD`,
                        `$${order.usd.toFixed(2)} USD`,
                        formatMoney(convertedValue)
                    ]
                ],
                theme: 'striped',
                headStyles: { fillColor: brandColor, textColor: 255 },
                styles: { font: 'helvetica', fontSize: 10, cellPadding: 6 },
                columnStyles: { 3: { halign: 'right', fontStyle: 'bold' } }
            });

            // --- TOTAIS ---
            let finalY = doc.lastAutoTable.finalY + 15;
            
            doc.setTextColor(...grayColor);
            doc.setFontSize(10);
            doc.text("Subtotal:", 140, finalY);
            doc.text("Taxa de Serviço:", 140, finalY + 8);
            
            doc.setTextColor(...darkColor);
            doc.setFont("helvetica", "bold");
            doc.text(formatMoney(convertedValue), 195, finalY, null, null, "right");
            doc.text(isFreeTax ? "GRÁTIS" : formatMoney(order.tax), 195, finalY + 8, null, null, "right");

            doc.setDrawColor(226, 232, 240);
            doc.line(140, finalY + 12, 195, finalY + 12);

            doc.setFontSize(14);
            doc.setTextColor(...brandColor);
            doc.text("TOTAL:", 140, finalY + 22);
            doc.text(formatMoney(order.total), 195, finalY + 22, null, null, "right");

            return doc;
        }

        async function sendToEvolutionApi(order, base64Pdf) {
            showStatus('A conectar com a API do WhatsApp...', 'info');
            
            try {
                // Aqui chamas o TEU servidor Node.js (que configuramos abaixo)
                const response = await fetch('/api/send-whatsapp-invoice', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        orderId: order.orderId,
                        clientName: order.name,
                        phone: order.whatsapp,
                        pdfData: base64Pdf // O base64 começa com "data:application/pdf;filename=generated.pdf;base64,"
                    })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    showStatus('✅ Fatura enviada com sucesso para o cliente no WhatsApp!', 'success');
                } else {
                    throw new Error(result.error || 'Erro desconhecido na API.');
                }
            } catch (err) {
                showStatus(`Erro ao enviar: ${err.message}`, 'error');
            }
        }

        function showStatus(msg, type) {
            const area = document.getElementById('statusArea');
            area.className = 'mt-6 p-4 rounded-xl border text-sm font-medium flex items-center gap-2';
            
            if (type === 'error') area.classList.add('bg-red-50', 'text-red-600', 'border-red-200');
            else if (type === 'info') area.classList.add('bg-blue-50', 'text-blue-600', 'border-blue-200');
            else area.classList.add('bg-green-50', 'text-green-600', 'border-green-200');
            
            const icon = type === 'error' ? 'alert-circle' : type === 'info' ? 'loader-2' : 'check-circle-2';
            const spin = type === 'info' ? 'animate-spin' : '';
            
            area.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5 ${spin}"></i> <span>${msg}</span>`;
            lucide.createIcons();
        }
    </script>
</body>
</html>
