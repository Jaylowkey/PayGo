<!DOCTYPE html>
<html lang="pt-MZ">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PayGo Admin | Gestão de Faturamento Pro</title>
  
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0f172a">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['"Outfit"', 'sans-serif'],
          },
          colors: {
            brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 950: '#0f172a' },
            accent: { 500: '#8b5cf6' },
            success: { 500: '#10b981' },
            warning: { 500: '#f59e0b' },
            danger: { 500: '#ef4444' }
          }
        }
      }
    };
  </script>
  
  <style>
    /* Estilização Profissional Customizada */
    .glass-effect {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.8);
    }
    
    .btn-hover {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .btn-hover:active { transform: scale(0.97); }

    .custom-shadow { box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02); }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-slide-up { animation: slideUp 0.5s ease-out forwards; }

    input:focus::placeholder { opacity: 0.3; transform: translateX(10px); transition: all 0.3s; }
  </style>
</head>
<body class="bg-[#f8fafc] text-slate-900 font-sans min-h-screen selection:bg-brand-500 selection:text-white">

<div id="pageLoader" class="fixed inset-0 bg-brand-950 z-[100] flex flex-col items-center justify-center transition-opacity duration-500">
  <div class="relative w-24 h-24">
    <div class="absolute inset-0 border-4 border-white/5 rounded-full"></div>
    <div class="absolute inset-0 border-4 border-t-brand-500 rounded-full animate-spin"></div>
    <div class="absolute inset-0 flex items-center justify-center">
      <i data-lucide="zap" class="w-8 h-8 text-brand-500 fill-current"></i>
    </div>
  </div>
  <h2 class="text-white text-2xl font-display font-bold mt-8 tracking-tight">PayGo OS</h2>
  <p class="text-slate-400 text-sm mt-2 font-medium">Iniciando módulos de faturamento...</p>
</div>

<aside class="fixed left-0 top-0 h-full w-72 bg-brand-950 text-slate-400 hidden lg:flex flex-col z-40 border-r border-white/5">
  <div class="p-8 border-b border-white/5 flex items-center gap-4">
    <div class="bg-gradient-to-tr from-brand-600 to-accent-500 p-2.5 rounded-2xl text-white shadow-xl">
      <i data-lucide="layers" class="w-6 h-6"></i>
    </div>
    <span class="text-2xl font-display font-extrabold text-white tracking-tight">PayGo<span class="text-brand-500">.</span></span>
  </div>
  
  <nav class="flex-1 p-6 space-y-2">
    <div class="pb-4"><span class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-500 px-4">Menu Principal</span></div>
    <a href="#" class="flex items-center gap-4 px-4 py-3.5 bg-brand-500/10 text-white border-l-4 border-brand-500 rounded-xl font-bold transition-all">
      <i data-lucide="file-text" class="w-5 h-5"></i> Gestão de Faturas
    </a>
    <a href="clientes.html" class="flex items-center gap-4 px-4 py-3.5 hover:bg-white/5 hover:text-white rounded-xl transition-all">
      <i data-lucide="users" class="w-5 h-5"></i> Base de Clientes
    </a>
    <a href="dashboard.html" class="flex items-center gap-4 px-4 py-3.5 hover:bg-white/5 hover:text-white rounded-xl transition-all">
      <i data-lucide="bar-chart-3" class="w-5 h-5"></i> Estatísticas
    </a>
  </nav>

  <div class="p-6">
    <div class="bg-white/5 rounded-2xl p-4 border border-white/5 flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-brand-600 flex items-center justify-center text-white font-bold ring-4 ring-brand-500/20">A</div>
      <div class="overflow-hidden">
        <p class="text-sm font-bold text-white truncate">Administrator</p>
        <p class="text-[10px] text-slate-500 uppercase font-black">Nível de Acesso 5</p>
      </div>
    </div>
  </div>
</aside>

<main class="lg:ml-72 p-6 md:p-12 transition-all duration-300">
  <div class="max-w-5xl mx-auto">
    
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-12">
      <div>
        <h1 class="text-4xl font-display font-extrabold text-slate-900 tracking-tight sm:text-5xl">Faturamento<span class="text-brand-600">.</span></h1>
        <p class="text-slate-500 mt-2 font-medium">Gere comprovativos autenticados com um clique.</p>
      </div>
      <div id="dbStatus" class="px-5 py-2.5 rounded-2xl text-[11px] font-black uppercase tracking-widest flex items-center gap-3 glass-effect shadow-sm">
        <span class="w-2.5 h-2.5 rounded-full bg-slate-300 animate-pulse"></span> Offline
      </div>
    </header>

    <section class="glass-effect rounded-[2rem] p-3 custom-shadow mb-12 border-brand-100">
      <div class="flex flex-col md:flex-row gap-3">
        <div class="relative flex-1 group">
          <i data-lucide="hash" class="absolute left-6 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400 group-focus-within:text-brand-500 transition-colors"></i>
          <input type="text" id="orderIdInput" placeholder="DIGITE O ID DO PEDIDO (EX: PG-100)" 
            class="w-full pl-16 pr-6 py-6 bg-transparent border-none focus:ring-0 text-xl font-mono font-black uppercase placeholder:text-slate-300">
        </div>
        <button onclick="searchOrder()" id="btnSearch" class="btn-hover px-10 py-6 bg-brand-950 hover:bg-brand-600 text-white rounded-[1.5rem] font-black flex items-center justify-center gap-3 shadow-xl shadow-brand-950/20">
          <span>LOCALIZAR</span>
          <i data-lucide="chevron-right" class="w-5 h-5"></i>
        </button>
      </div>
    </section>

    <div id="displayArea" class="min-h-[400px]">
      <div id="emptyState" class="flex flex-col items-center justify-center py-20 text-center opacity-60">
        <div class="w-24 h-24 bg-slate-200/50 rounded-full flex items-center justify-center mb-6">
          <i data-lucide="database-zap" class="w-10 h-10 text-slate-400"></i>
        </div>
        <h3 class="text-xl font-bold text-slate-400 uppercase tracking-widest">Aguardando Entrada</h3>
        <p class="text-slate-400 mt-2">Os dados do pedido aparecerão aqui após a busca.</p>
      </div>
    </div>
  </div>
</main>

<div id="toastContainer" class="fixed bottom-8 right-8 z-[9999] space-y-4"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { initializeFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyAHxyX5e9O8qQo6Z3VHURgVXhxbxSp0Qh8",
    authDomain: "paygo-14311.firebaseapp.com",
    projectId: "paygo-14311",
    storageBucket: "paygo-14311.firebasestorage.app",
    messagingSenderId: "208360646277",
    appId: "1:208360646277:web:aecc57cc0077ae48a52bec"
  };

  let db;
  let currentOrder = null;

  // Boot do Sistema
  async function bootstrap() {
    try {
      const app = initializeApp(FIREBASE_CONFIG);
      // 🔥 CONEXÃO CORRIGIDA PARA O SEU BANCO ESPECÍFICO
      db = initializeFirestore(app, { experimentalForceLongPolling: true }, "paygo-14311");

      setUIStatus('✅ Sistema Online', 'bg-success-500', 'text-success-500 bg-success-500/10');
      
      const loader = document.getElementById('pageLoader');
      loader.classList.add('opacity-0');
      setTimeout(() => loader.remove(), 500);
      
      lucide.createIcons();
    } catch (error) {
      console.error("Critical Error:", error);
      showToast("Falha crítica de comunicação.", "error");
    }
  }

  // Lógica de Busca
  window.searchOrder = async function() {
    const input = document.getElementById('orderIdInput');
    const id = input.value.trim().toUpperCase().replace(/\s/g, '');
    const btn = document.getElementById('btnSearch');

    if (!id) return showToast("Insira um ID válido.", "warning");

    toggleLoading(btn, true);

    try {
      // Check Cache
      const cached = sessionStorage.getItem(`pg_order_${id}`);
      if (cached) {
        currentOrder = JSON.parse(cached);
        renderOrder(currentOrder);
        showToast("Dados recuperados do cache local.", "success");
        return;
      }

      const q = query(collection(db, "orders"), where("orderId", "==", id));
      const snap = await getDocs(q);

      if (snap.empty) {
        renderError();
        showToast("Pedido não localizado no banco.", "error");
      } else {
        currentOrder = snap.docs[0].data();
        sessionStorage.setItem(`pg_order_${id}`, JSON.stringify(currentOrder));
        renderOrder(currentOrder);
        showToast("Sincronização concluída!", "success");
      }
    } catch (e) {
      showToast("Erro na leitura do Firestore.", "error");
    } finally {
      toggleLoading(btn, false);
    }
  };

  // Renderização Pro
  function renderOrder(order) {
    const container = document.getElementById('displayArea');
    const isDone = order.status === 'completed';

    container.innerHTML = `
      <div class="animate-slide-up">
        <div class="grid lg:grid-cols-3 gap-8">
          
          <div class="lg:col-span-2 glass-effect rounded-[2.5rem] p-10 custom-shadow border-none">
            <div class="flex justify-between items-start mb-12">
              <div class="flex items-center gap-5">
                <div class="w-16 h-16 bg-brand-500/10 text-brand-600 rounded-3xl flex items-center justify-center">
                  <i data-lucide="receipt" class="w-8 h-8"></i>
                </div>
                <div>
                  <span class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Referência do Pedido</span>
                  <h2 class="text-3xl font-display font-black text-slate-900">${order.orderId}</h2>
                </div>
              </div>
              <div class="flex flex-col items-end gap-2">
                <span class="px-5 py-2 rounded-full text-[11px] font-black uppercase tracking-widest ${isDone ? 'bg-success-500 text-white' : 'bg-warning-500 text-white'}">
                  ${isDone ? 'Concluído' : 'Processando'}
                </span>
                <span class="text-[11px] font-bold text-slate-400 font-mono">${new Date().toLocaleDateString('pt-MZ')}</span>
              </div>
            </div>

            <div class="grid md:grid-cols-2 gap-12">
              <div class="space-y-8">
                <div>
                  <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-4">Dados do Cliente</label>
                  <div class="bg-slate-50/50 rounded-3xl p-6 border border-slate-100">
                    <p class="text-sm font-bold text-slate-400 mb-1">Nome Completo</p>
                    <p class="text-lg font-bold text-slate-900 mb-4">${order.name || '---'}</p>
                    <p class="text-sm font-bold text-slate-400 mb-1">WhatsApp de Contato</p>
                    <p class="text-lg font-bold text-slate-900">${order.whatsapp || '---'}</p>
                  </div>
                </div>
              </div>

              <div class="space-y-8 text-right md:text-left">
                <div>
                  <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-4">Detalhes Financeiros</label>
                  <div class="bg-brand-950 rounded-3xl p-6 text-white custom-shadow">
                    <div class="flex justify-between text-sm opacity-60 mb-2"><span>Valor Base</span> <span>$${(order.usd || 0).toFixed(2)}</span></div>
                    <div class="flex justify-between text-sm opacity-60 mb-6"><span>Taxa PayGo</span> <span>${formatMZ(order.tax)}</span></div>
                    <div class="border-t border-white/10 pt-4 flex justify-between items-end">
                      <span class="text-xs font-bold text-brand-400">TOTAL</span>
                      <span class="text-3xl font-display font-black">${formatMZ(order.total)}</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="space-y-6">
            <button onclick="generatePDF()" class="btn-hover w-full group py-8 bg-white border border-slate-200 hover:border-brand-500 rounded-[2rem] custom-shadow flex flex-col items-center gap-4">
              <div class="w-14 h-14 bg-slate-50 text-slate-400 group-hover:bg-brand-500 group-hover:text-white rounded-2xl flex items-center justify-center transition-all duration-300">
                <i data-lucide="file-down" class="w-6 h-6"></i>
              </div>
              <span class="font-black text-slate-900 uppercase tracking-tighter">Emitir PDF Oficial</span>
            </button>

            <button onclick="sendWhatsApp()" class="btn-hover w-full group py-8 bg-[#25D366] hover:bg-[#1fb355] rounded-[2rem] shadow-xl shadow-green-200 flex flex-col items-center gap-4 text-white">
              <div class="w-14 h-14 bg-white/20 rounded-2xl flex items-center justify-center">
                <i data-lucide="send" class="w-6 h-6"></i>
              </div>
              <span class="font-black uppercase tracking-tighter">Enviar via WhatsApp</span>
            </button>
          </div>

        </div>
      </div>
    `;
    lucide.createIcons();
  }

  // Gerador de PDF Pro
  window.generatePDF = async function() {
    if(!currentOrder) return;
    
    showToast("Renderizando documento...", "info");
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    
    // Header Estilo Dark
    doc.setFillColor(15, 23, 42);
    doc.rect(0, 0, 210, 50, 'F');
    
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(28);
    doc.setFont("helvetica", "bold");
    doc.text("PayGo", 20, 32);
    
    doc.setFontSize(9);
    doc.setFont("helvetica", "normal");
    doc.text("SOLUÇÕES DE PAGAMENTO DIGITAL EM MOÇAMBIQUE", 20, 42);
    
    // QR Code dinâmico
    const qrData = await QRCode.toDataURL(`https://paygo.co.mz/v/${currentOrder.orderId}`);
    doc.addImage(qrData, 'PNG', 165, 10, 30, 30);

    // Corpo
    doc.setTextColor(15, 23, 42);
    doc.setFontSize(16);
    doc.text(`COMPROVATIVO DE OPERAÇÃO: ${currentOrder.orderId}`, 20, 75);
    
    doc.autoTable({
      startY: 90,
      head: [['DESCRIÇÃO DO SERVIÇO', 'REFERÊNCIA', 'VALOR BASE', 'TOTAL PAGO']],
      body: [[
        'SERVIÇO DE INTERMEDIAÇÃO E COMPRA INTERNACIONAL',
        currentOrder.orderId,
        `USD ${currentOrder.usd.toFixed(2)}`,
        formatMZ(currentOrder.total)
      ]],
      theme: 'grid',
      headStyles: { fillColor: [37, 99, 235], fontSize: 10 },
      styles: { cellPadding: 8, fontSize: 10 }
    });

    const finalY = doc.lastAutoTable.finalY + 30;
    doc.setFontSize(8);
    doc.setTextColor(100, 116, 139);
    doc.text("Este documento é gerado automaticamente e serve como prova de pagamento.", 105, finalY, { align: "center" });

    doc.save(`FATURA_PAYGO_${currentOrder.orderId}.pdf`);
    showToast("Documento pronto!", "success");
  }

  // Integração WhatsApp Inteligente
  window.sendWhatsApp = async function() {
    if(!currentOrder) return;
    
    const doc = await buildInvoiceDocRaw(currentOrder);
    const pdfBase64 = doc.output('datauristring');
    
    // Higienização de telefone
    let phone = currentOrder.whatsapp.replace(/\D/g, '');
    if (phone.length === 9) phone = '258' + phone;

    try {
      const response = await fetch('/api/send-whatsapp-invoice', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone, orderId: currentOrder.orderId, pdfData: pdfBase64 })
      });

      if (response.ok) showToast("Entregue via Evolution API!", "success");
      else throw new Error();
    } catch {
      // Fallback robusto
      const msg = encodeURIComponent(`Olá ${currentOrder.name}! Aqui está a fatura do seu pedido PayGo: ${currentOrder.orderId}. Obrigado por escolher a PayGo! 🚀`);
      window.open(`https://wa.me/${phone}?text=${msg}`, '_blank');
      doc.save(`FATURA_${currentOrder.orderId}.pdf`);
      showToast("Usando envio manual assistido.", "warning");
    }
  }

  // Auxiliares
  async function buildInvoiceDocRaw(order) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.text(`FATURA PAYGO: ${order.orderId}`, 20, 20);
    doc.text(`Cliente: ${order.name}`, 20, 30);
    doc.text(`Total: ${formatMZ(order.total)}`, 20, 40);
    return doc;
  }

  function formatMZ(val) {
    return new Intl.NumberFormat('pt-MZ', { style: 'currency', currency: 'MZN' }).format(val || 0).replace('MZN', 'MT');
  }

  function setUIStatus(text, dotColor, bgClass) {
    const el = document.getElementById('dbStatus');
    el.className = `px-5 py-2.5 rounded-2xl text-[11px] font-black uppercase tracking-widest flex items-center gap-3 glass-effect shadow-sm ${bgClass}`;
    el.innerHTML = `<span class="w-2.5 h-2.5 rounded-full ${dotColor} animate-pulse"></span> ${text}`;
  }

  function showToast(msg, type) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    const style = type === 'error' ? 'bg-danger-500' : type === 'warning' ? 'bg-warning-500' : 'bg-brand-950';
    
    toast.className = `${style} text-white px-8 py-5 rounded-[1.5rem] font-black shadow-2xl flex items-center gap-4 transform transition-all duration-500 translate-y-20 opacity-0 custom-shadow`;
    toast.innerHTML = `<i data-lucide="bell" class="w-5 h-5"></i> <span class="tracking-tight uppercase text-xs">${msg}</span>`;
    
    container.appendChild(toast);
    lucide.createIcons({ root: toast });
    
    setTimeout(() => toast.classList.remove('translate-y-20', 'opacity-0'), 100);
    setTimeout(() => {
      toast.classList.add('opacity-0', 'scale-90');
      setTimeout(() => toast.remove(), 500);
    }, 4500);
  }

  function toggleLoading(btn, isLoading) {
    btn.disabled = isLoading;
    btn.innerHTML = isLoading ? `<div class="w-6 h-6 border-4 border-white/20 border-t-white rounded-full animate-spin"></div>` : `<span>LOCALIZAR</span><i data-lucide="chevron-right" class="w-5 h-5"></i>`;
    lucide.createIcons();
  }

  function renderError() {
    document.getElementById('displayArea').innerHTML = `
      <div class="glass-effect rounded-[2.5rem] p-20 text-center animate-slide-up border-danger-500/20">
        <div class="w-20 h-20 bg-danger-500/10 text-danger-500 rounded-3xl flex items-center justify-center mx-auto mb-6">
          <i data-lucide="search-x" class="w-10 h-10"></i>
        </div>
        <h3 class="text-2xl font-black text-slate-900 uppercase">Pedido não encontrado</h3>
        <p class="text-slate-500 mt-2">Verifique se o ID está correto ou se foi processado no app.</p>
      </div>
    `;
    lucide.createIcons();
  }

  document.addEventListener('keypress', e => { if(e.key === 'Enter') searchOrder(); });
  bootstrap();
</script>
</body>
</html>
