<!DOCTYPE html>
<html lang="pt-MZ" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Central de Mensagens | Admin PayGo</title>
    <meta name="description" content="Painel de suporte e mensagens para administração PayGo">
    <meta name="theme-color" content="#0f172a">
    <meta name="robots" content="noindex, nofollow">
    
    <!-- PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="manifest" href="/manifest.json">
    
    <!-- ✅ URLs 100% LIMPAS - SEM ESPAÇOS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'], 
                        display: ['"Outfit"', 'system-ui', 'sans-serif'], 
                        mono: ['"Fira Code"', 'monospace'] 
                    },
                    colors: { 
                        brand: { 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }, 
                        success: { 400: '#4ade80', 500: '#22c55e', 600: '#16a34a' }, 
                        warning: { 400: '#fbbf24', 500: '#f59e0b' }, 
                        danger: { 400: '#f87171', 500: '#ef4444' } 
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-out',
                        'slide-up': 'slideUp 0.4s ease-out',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite'
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
                    }
                }
            }
        };
    </script>
    
    <style>
        /* Base */
        body { background-color: #0f172a; color: #f8fafc; overflow: hidden; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; transition: background 0.2s; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        /* Background Effects */
        .bg-grid { 
            background-size: 40px 40px; 
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px); 
        }
        
        /* Glass Effects */
        .glass-nav { 
            background: rgba(15, 23, 42, 0.85); 
            backdrop-filter: blur(16px) saturate(180%); 
            border-bottom: 1px solid rgba(255,255,255,0.08); 
        }
        .glass-card { 
            background: rgba(30, 41, 59, 0.4); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        /* Chat Scroll */
        .chat-scroll { 
            overflow-y: auto; 
            scroll-behavior: smooth; 
        }
        .chat-scroll::-webkit-scrollbar { width: 4px; }
        .chat-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        
        /* Ticket Items */
        .ticket-item { 
            transition: all 0.2s ease; 
            border-left: 3px solid transparent;
        }
        .ticket-item:hover { background: rgba(59, 130, 246, 0.05); }
        .ticket-item.active { 
            background: rgba(59, 130, 246, 0.15); 
            border-left-color: #3b82f6; 
        }
        
        /* Message Bubbles */
        .msg-admin { 
            background: linear-gradient(135deg, #2563eb, #3b82f6); 
            color: white; 
            border-radius: 16px 16px 4px 16px; 
            align-self: flex-end; 
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        .msg-client { 
            background: #1e293b; 
            color: #e2e8f0; 
            border-radius: 16px 16px 16px 4px; 
            align-self: flex-start; 
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        /* Typing Indicator */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
            background: #1e293b;
            border-radius: 16px;
            width: fit-content;
        }
        .typing-dot {
            width: 6px;
            height: 6px;
            background: #94a3b8;
            border-radius: 50%;
            animation: typingBounce 1.4s infinite ease-in-out;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
            40% { transform: scale(1.2); opacity: 1; }
        }
        
        /* Toast Notifications */
        #toastContainer { 
            position: fixed; 
            top: 24px; 
            right: 24px; 
            z-index: 9999; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            pointer-events: none; 
        }
        .toast { 
            pointer-events: auto; 
            background: rgba(15, 23, 42, 0.95); 
            backdrop-filter: blur(12px);
            border-left: 4px solid #3b82f6; 
            padding: 16px 20px; 
            border-radius: 12px; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            transform: translateX(120%); 
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55), opacity 0.3s ease; 
            opacity: 0; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 350px;
        }
        .toast.show { transform: translateX(0); opacity: 1; }
        .toast.error { border-left-color: #ef4444; }
        .toast.success { border-left-color: #22c55e; }
        .toast.warning { border-left-color: #f59e0b; }
        .toast.info { border-left-color: #3b82f6; }
        
        /* Accessibility */
        :focus-visible {
            outline: 2px solid #3b82f6;
            outline-offset: 2px;
            border-radius: 4px;
        }
        
        /* Reduced Motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
        
        /* Mobile */
        @media (max-width: 768px) {
            .glass-card { border-radius: 1rem; }
            .toast { max-width: calc(100vw - 48px); }
        }
        
        /* Button Micro-interactions */
        .btn-hover {
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .btn-hover:active { transform: scale(0.98); }
        .btn-hover:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    </style>
</head>
<body class="selection:bg-brand-500 selection:text-white flex flex-col h-screen relative">

    <!-- Audio Notification -->
    <audio id="notifSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="none"></audio>

    <!-- Background Effects -->
    <div class="fixed inset-0 bg-grid opacity-20 pointer-events-none z-0"></div>
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[600px] h-[500px] bg-brand-600/10 rounded-full mix-blend-screen blur-[120px] pointer-events-none z-0"></div>
    
    <!-- Toast Container -->
    <div id="toastContainer" role="region" aria-label="Notificações"></div>

    <!-- Header -->
    <header class="w-full z-50 glass-nav shrink-0" role="banner">
        <div class="container mx-auto px-6 h-16 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <a href="../dashboard.html" class="text-slate-400 hover:text-white transition p-2 rounded-lg hover:bg-white/10" title="Voltar ao Dashboard" aria-label="Voltar ao dashboard">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </a>
                <div class="bg-brand-500/20 text-brand-400 p-2 rounded-lg" aria-hidden="true">
                    <i data-lucide="message-square" class="w-4 h-4"></i>
                </div>
                <span class="text-xl font-display font-bold text-white">Central de Mensagens</span>
            </div>
            <div class="flex items-center gap-3">
                <button class="relative p-2 text-slate-400 hover:text-white transition rounded-lg hover:bg-white/10" aria-label="Notificações">
                    <i data-lucide="bell" class="w-5 h-5"></i>
                    <span class="absolute -top-1 -right-1 flex h-3 w-3">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-danger-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-3 w-3 bg-danger-500 border-2 border-[#0f172a] text-[8px] flex items-center justify-center font-bold" id="unreadBadge" aria-live="polite">0</span>
                    </span>
                </button>
                <div class="w-px h-6 bg-slate-700 mx-2" aria-hidden="true"></div>
                <span class="text-sm font-bold text-slate-300" id="adminNameDisplay">Admin PayGo</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 container mx-auto px-2 sm:px-6 py-6 relative z-10 flex overflow-hidden">
        
        <div class="flex w-full h-full glass-card rounded-2xl overflow-hidden shadow-2xl">
            
            <!-- Sidebar: Ticket List -->
            <div class="w-full md:w-1/3 flex flex-col border-r border-slate-700/50 bg-slate-900/50 shrink-0" role="navigation" aria-label="Lista de tickets">
                <div class="p-4 border-b border-slate-700/50 space-y-3 shrink-0">
                    <div class="relative">
                        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500" aria-hidden="true"></i>
                        <input type="text" id="searchInput" placeholder="Procurar cliente ou pedido..." class="w-full pl-9 pr-4 py-2 bg-slate-950 border border-slate-700 rounded-lg text-sm text-white focus:border-brand-500 outline-none transition" aria-label="Pesquisar tickets">
                    </div>
                    <div class="flex gap-2" role="tablist" aria-label="Filtros de tickets">
                        <button onclick="window.filterTickets('all')" class="flex-1 py-1.5 text-[10px] font-bold uppercase tracking-widest bg-brand-500/20 text-brand-400 rounded border border-brand-500/30 transition hover:bg-brand-500/30" id="filter-all" role="tab" aria-selected="true">Todos</button>
                        <button onclick="window.filterTickets('open')" class="flex-1 py-1.5 text-[10px] font-bold uppercase tracking-widest bg-slate-800 text-slate-400 rounded border border-slate-700 transition hover:bg-slate-700" id="filter-open" role="tab" aria-selected="false">Abertos</button>
                    </div>
                </div>

                <div class="flex-1 chat-scroll" id="ticketList" role="list">
                    <!-- Loading Skeleton -->
                    <div class="p-4 flex items-center gap-3 animate-pulse" aria-hidden="true">
                        <div class="w-10 h-10 bg-slate-800 rounded-full"></div>
                        <div class="flex-1 space-y-2">
                            <div class="h-3 bg-slate-800 rounded w-3/4"></div>
                            <div class="h-2 bg-slate-800 rounded w-1/2"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Chat Area -->
            <div class="hidden md:flex flex-col flex-1 bg-slate-950 relative" id="chatArea" role="region" aria-label="Área de chat">
                
                <!-- Empty State -->
                <div id="emptyChatState" class="absolute inset-0 flex flex-col items-center justify-center text-center p-6 z-20 bg-slate-950">
                    <div class="w-20 h-20 bg-slate-900 rounded-full flex items-center justify-center mb-4 text-slate-700 shadow-inner" aria-hidden="true">
                        <i data-lucide="message-square-dashed" class="w-10 h-10"></i>
                    </div>
                    <h3 class="text-xl font-bold text-white mb-2">Caixa de Entrada Segura</h3>
                    <p class="text-slate-500 text-sm max-w-sm">Selecione uma conversa ao lado para responder a pedidos de reembolso, suporte ou recargas de Cartão Virtual.</p>
                </div>

                <!-- Chat Header -->
                <div class="p-4 border-b border-slate-800 bg-slate-900/80 flex justify-between items-center shrink-0">
                    <div class="flex items-center gap-3">
                        <button class="md:hidden text-slate-400 hover:text-white p-1 transition" onclick="window.closeMobileChat()" aria-label="Voltar à lista">
                            <i data-lucide="chevron-left" class="w-6 h-6"></i>
                        </button>
                        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-brand-500 to-brand-600 flex items-center justify-center text-white font-bold text-lg shadow-sm" id="chatAvatar" aria-hidden="true">C</div>
                        <div>
                            <h3 class="font-bold text-white leading-tight" id="chatClientName">Nome do Cliente</h3>
                            <p class="text-[11px] text-slate-400 font-mono" id="chatClientEmail">cliente@email.com</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 sm:gap-3">
                        <div id="chatTicketTypeContainer">
                            <span id="chatTicketType" class="px-2.5 py-1 rounded text-[10px] font-bold uppercase tracking-widest bg-slate-800 text-slate-300 border border-slate-700">TICKET</span>
                        </div>
                        <select id="ticketStatusSelect" onchange="window.updateTicketStatus(this.value)" class="bg-slate-950 border border-slate-700 text-xs sm:text-sm text-white rounded-lg px-2 sm:px-3 py-1.5 focus:border-brand-500 outline-none cursor-pointer" aria-label="Alterar status do ticket">
                            <option value="open">🟢 Pendente</option>
                            <option value="in_progress">🟡 Em Análise</option>
                            <option value="closed">🔴 Concluído</option>
                        </select>
                    </div>
                </div>

                <!-- Context Box for Ticket Type -->
                <div id="chatContextBox" class="bg-slate-900/50 p-3 border-b border-slate-800 text-xs shrink-0 hidden" role="complementary" aria-label="Contexto do ticket">
                </div>

                <!-- Message History -->
                <div class="flex-1 chat-scroll p-4 md:p-6 space-y-4 flex flex-col" id="messageHistory" role="log" aria-live="polite" aria-label="Histórico de mensagens">
                    <!-- Messages will be injected here -->
                </div>

                <!-- Message Input -->
                <div class="p-4 bg-slate-900 border-t border-slate-800 shrink-0">
                    <form id="replyForm" class="flex items-end gap-2 relative" novalidate>
                        
                        <!-- File Upload -->
                        <div class="relative shrink-0">
                            <input type="file" id="fileUpload" class="hidden" accept="image/*, .pdf, .doc, .docx" onchange="window.handleFileSelect(event)" aria-label="Anexar ficheiro">
                            <button type="button" onclick="document.getElementById('fileUpload').click()" class="w-12 h-12 rounded-xl bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-400 hover:text-brand-400 transition" title="Anexar Comprovativo ou Imagem" aria-label="Anexar ficheiro">
                                <i data-lucide="paperclip" class="w-5 h-5"></i>
                            </button>
                            <div id="fileBadge" class="absolute -top-2 -right-2 w-4 h-4 bg-success-500 rounded-full hidden border-2 border-slate-900" aria-hidden="true"></div>
                        </div>

                        <!-- Text Input -->
                        <div class="flex-1 bg-slate-950 border border-slate-700 rounded-xl relative focus-within:border-brand-500 transition-colors">
                            <textarea id="replyMessage" rows="1" class="w-full bg-transparent text-white px-4 py-3 outline-none resize-none text-sm max-h-32 min-h-[48px] chat-scroll" placeholder="Escreva a sua resposta ou envie um comprovativo..." oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'" aria-label="Mensagem"></textarea>
                        </div>

                        <!-- Send Button -->
                        <button type="submit" id="btnSendReply" class="w-12 h-12 rounded-xl bg-brand-600 hover:bg-brand-500 flex items-center justify-center text-white transition shadow-lg shrink-0" aria-label="Enviar mensagem">
                            <i data-lucide="send" class="w-5 h-5 ml-1"></i>
                        </button>
                    </form>
                    <div id="fileNameDisplay" class="text-[10px] text-brand-400 mt-2 font-mono hidden truncate px-1" aria-live="polite">Ficheiro selecionado</div>
                </div>

            </div>
        </div>
    </main>

<script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, orderBy, onSnapshot, updateDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        // ==========================================
        // 🔐 CONFIGURAÇÃO FIREBASE
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyAHxyX5e9O8qQo6Z3VHURgVXhxbxSp0Qh8",
            authDomain: "paygo-14311.firebaseapp.com",
            projectId: "paygo-14311",
            storageBucket: "paygo-14311.firebasestorage.app",
            messagingSenderId: "208360646277",
            appId: "1:208360646277:web:aecc57cc0077ae48a52bec"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app, "paygodb"); // Base de dados unificada
        const storage = getStorage(app);

        if (typeof lucide !== 'undefined') lucide.createIcons();

        // ==========================================
        // 🌍 ESTADO GLOBAL
        // ==========================================
        let currentAdmin = null;
        let allTickets = [];
        let activeTicketId = null;
        let currentFilter = 'all';
        let initialLoad = true;
        let unsubscribeMessages = null;
        let selectedFile = null;
        const notifSound = document.getElementById('notifSound');

        // ==========================================
        // 🛡️ SEGURANÇA E TOASTS
        // ==========================================
        const escapeHTML = (str) => {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        };

        window.showToast = function(msg, type = 'success', duration = 4000) {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            
            const toast = document.createElement('div');
            const bg = type === 'error' ? 'bg-danger-500/95 border-danger-400' : 
                      type === 'info' ? 'bg-slate-800/95 border-brand-400' : 
                      type === 'warning' ? 'bg-warning-500/95 border-warning-400' : 
                      'bg-slate-900/95 border-brand-500';
            
            const icon = type === 'error' ? 'alert-octagon text-danger-400' : 
                        type === 'info' ? 'bell text-brand-400' : 
                        type === 'warning' ? 'alert-triangle text-warning-400' : 
                        'check-check text-brand-400';
            
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i data-lucide="${icon.split(' ')[0]}" class="w-5 h-5 ${icon.split(' ')[1]}"></i> <span class="text-sm font-bold text-white">${msg}</span>`;
            
            container.appendChild(toast);
            if (typeof lucide !== 'undefined') { try { lucide.createIcons({ root: toast }); } catch(e) {} }
            
            requestAnimationFrame(() => { toast.classList.remove('translate-x-full', 'opacity-0'); });
            setTimeout(() => { toast.classList.add('opacity-0', 'translate-x-8'); setTimeout(() => toast.remove(), 400); }, duration);
        };

        // ==========================================
        // 🔐 AUTENTICAÇÃO
        // ==========================================
        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = '../login.html'; return; }
            
            try {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (!userDoc.exists() || (userDoc.data().role !== 'admin' && userDoc.data().role !== 'superadmin')) {
                    showToast('Acesso restrito a administradores.', 'error');
                    setTimeout(() => { window.location.href = '../dashboard.html'; }, 1500);
                    return;
                }
                
                currentAdmin = user;
                document.getElementById('adminNameDisplay').textContent = userDoc.data().name || 'Admin PayGo';
                loadTickets();
                
            } catch (error) { 
                console.error("Erro de Auth:", error); 
                showToast('Erro ao carregar perfil.', 'error');
            }
        });

        // ==========================================
        // 📥 CARREGAR TICKETS EM TEMPO REAL
        // ==========================================
        function loadTickets() {
            const q = query(collection(db, "support_tickets"), orderBy("createdAt", "desc"));
            
            onSnapshot(q, (snapshot) => {
                let unreadCount = 0;
                let hasNewTicket = false;
                allTickets = [];

                snapshot.forEach((docSnap) => {
                    const ticket = { id: docSnap.id, ...docSnap.data() };
                    allTickets.push(ticket);
                    if (ticket.status === 'open') unreadCount++;
                });

                snapshot.docChanges().forEach((change) => {
                    if (change.type === "added" && !initialLoad) { hasNewTicket = true; }
                });

                if (hasNewTicket) {
                    try { notifSound.currentTime = 0; notifSound.play().catch(e=>{}); } catch(e) {}
                    showToast("🔔 Nova mensagem recebida!", "info");
                }

                document.getElementById('unreadBadge').textContent = unreadCount;
                renderTicketList();
                initialLoad = false;
                
                if (activeTicketId) {
                    const updatedActive = allTickets.find(t => t.id === activeTicketId);
                    if (updatedActive && updatedActive.status !== document.getElementById('ticketStatusSelect').value) {
                        document.getElementById('ticketStatusSelect').value = updatedActive.status;
                    }
                }
            }, (error) => { showToast('Erro ao conectar ao servidor.', 'error'); });
        }

        // ==========================================
        // 📋 RENDERIZAR LISTA DE TICKETS
        // ==========================================
        window.filterTickets = (type) => {
            currentFilter = type;
            ['all', 'open'].forEach(f => {
                const btn = document.getElementById(`filter-${f}`);
                if (f === type) {
                    btn.classList.remove('bg-slate-800', 'text-slate-400');
                    btn.classList.add('bg-brand-500/20', 'text-brand-400');
                } else {
                    btn.classList.remove('bg-brand-500/20', 'text-brand-400');
                    btn.classList.add('bg-slate-800', 'text-slate-400');
                }
            });
            renderTicketList();
        };

        document.getElementById('searchInput')?.addEventListener('input', () => renderTicketList());

        function renderTicketList() {
            const listEl = document.getElementById('ticketList');
            const search = document.getElementById('searchInput')?.value.toLowerCase() || '';
            listEl.innerHTML = '';

            let filtered = allTickets.filter(t => {
                if (currentFilter === 'open' && t.status !== 'open') return false;
                if (search) {
                    const searchable = [t.userName, t.userEmail, t.orderId, t.message, t.type].filter(Boolean).join(' ').toLowerCase();
                    if (!searchable.includes(search)) return false;
                }
                return true;
            });

            if (filtered.length === 0) {
                listEl.innerHTML = `<div class="p-6 text-center text-slate-500 text-sm flex flex-col items-center gap-2"><i data-lucide="inbox" class="w-8 h-8 opacity-30"></i><span>Nenhum ticket encontrado</span></div>`;
                if (typeof lucide !== 'undefined') lucide.createIcons({root: listEl}); return;
            }

            filtered.forEach(ticket => {
                const dateStr = ticket.createdAt?.toDate ? ticket.createdAt.toDate().toLocaleDateString('pt-MZ') : 'Recente';
                const initial = escapeHTML(ticket.userName || 'C').charAt(0).toUpperCase();
                const isActive = activeTicketId === ticket.id ? 'active' : '';
                const isUnread = ticket.status === 'open' ? '<div class="w-2 h-2 rounded-full bg-brand-500 absolute right-4 top-4 shadow-[0_0_8px_rgba(59,130,246,0.8)]"></div>' : '';

                let typeBadge = '';
                if (ticket.type === 'refund') typeBadge = `<span class="text-[8px] px-1.5 py-0.5 rounded bg-danger-500/20 text-danger-400 border border-danger-500/30">REEMBOLSO</span>`;
                else if (ticket.type === 'vc_topup') typeBadge = `<span class="text-[8px] px-1.5 py-0.5 rounded bg-success-500/20 text-success-400 border border-success-500/30">RECARGA VC</span>`;
                else typeBadge = `<span class="text-[8px] px-1.5 py-0.5 rounded bg-slate-700 text-slate-300 border border-slate-600">MENSAGEM</span>`;

                const div = document.createElement('div');
                div.className = `ticket-item p-4 border-b border-slate-800/50 cursor-pointer hover:bg-slate-800/30 transition relative flex gap-3 ${isActive}`;
                div.onclick = () => selectTicket(ticket.id);
                
                div.innerHTML = `
                    ${isUnread}
                    <div class="w-10 h-10 rounded-full bg-slate-800 text-slate-300 flex items-center justify-center font-bold shrink-0 border border-slate-700">${initial}</div>
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-start mb-1">
                            <h4 class="text-sm font-bold text-white truncate pr-4">${escapeHTML(ticket.userName || 'Cliente')}</h4>
                            <span class="text-[9px] text-slate-500 whitespace-nowrap">${dateStr}</span>
                        </div>
                        <div class="flex items-center gap-2 mb-1">
                            ${typeBadge}
                            <span class="text-xs text-slate-400 truncate">${ticket.orderId ? '#' + escapeHTML(ticket.orderId) : ''}</span>
                        </div>
                        <p class="text-xs text-slate-500 truncate pr-2">${escapeHTML(ticket.message?.substring(0, 50) || 'Sem mensagem')}${(ticket.message?.length || 0) > 50 ? '...' : ''}</p>
                    </div>
                `;
                listEl.appendChild(div);
            });
            if (typeof lucide !== 'undefined') lucide.createIcons({root: listEl});
        }

        // ==========================================
        // 💬 ABRIR E GERIR O CHAT ATIVO
        // ==========================================
        window.selectTicket = async (id) => {
            activeTicketId = id;
            renderTicketList();

            const ticket = allTickets.find(t => t.id === id);
            if (!ticket) return;

            document.getElementById('emptyChatState')?.classList.add('hidden');
            const chatArea = document.getElementById('chatArea');
            chatArea?.classList.remove('hidden'); chatArea?.classList.add('flex');

            document.getElementById('chatAvatar').textContent = escapeHTML(ticket.userName || 'C').charAt(0).toUpperCase();
            document.getElementById('chatClientName').textContent = escapeHTML(ticket.userName || 'Cliente');
            document.getElementById('chatClientEmail').textContent = escapeHTML(ticket.userEmail || '');
            document.getElementById('ticketStatusSelect').value = ticket.status || 'open';

            const ctxBox = document.getElementById('chatContextBox');
            const mainBadge = document.getElementById('chatTicketType');
            ctxBox?.classList.remove('hidden');
            
            if (ticket.type === 'refund') {
                mainBadge.className = "px-2.5 py-1 rounded text-[10px] font-bold uppercase tracking-widest bg-danger-500/20 text-danger-400 border border-danger-500/30";
                mainBadge.textContent = "REEMBOLSO";
                ctxBox.innerHTML = `<span class="text-danger-400 font-bold">Pedido de Cancelamento:</span> Referente à Ordem <b>#${escapeHTML(ticket.orderId)}</b>.`;
                ctxBox.className = "bg-danger-900/10 p-3 border-b border-danger-500/20 text-xs shrink-0";
            } else if (ticket.type === 'vc_topup') {
                mainBadge.className = "px-2.5 py-1 rounded text-[10px] font-bold uppercase tracking-widest bg-success-500/20 text-success-400 border border-success-500/30";
                mainBadge.textContent = "RECARGA VC";
                const formatMZN = (val) => new Intl.NumberFormat('pt-MZ', { minimumFractionDigits: 2 }).format(val);
                ctxBox.innerHTML = `<span class="text-success-400 font-bold">Recarga de Cartão:</span> Cliente pagou ${formatMZN(ticket.mznCost || 0)} MT para <b>$${ticket.usdAmount || 0}</b>. <br/>💳 Destino: <b class="font-mono bg-slate-950 px-1 py-0.5 rounded text-white">${escapeHTML(ticket.destination || '')}</b>`;
                ctxBox.className = "bg-success-900/10 p-3 border-b border-success-500/20 text-xs shrink-0";
            } else {
                mainBadge.className = "px-2.5 py-1 rounded text-[10px] font-bold uppercase tracking-widest bg-slate-800 text-slate-300 border border-slate-700";
                mainBadge.textContent = "SUPORTE";
                ctxBox.innerHTML = `<span class="text-brand-400 font-bold">Mensagem de Suporte Geral</span>`;
                ctxBox.className = "bg-slate-900/50 p-3 border-b border-slate-800 text-xs shrink-0";
            }

            if (ticket.status === 'open') {
                try { await updateDoc(doc(db, "support_tickets", id), { status: 'in_progress', updatedAt: serverTimestamp() }); } catch (e) {}
            }

            if (unsubscribeMessages) unsubscribeMessages();
            
            const msgQ = query(collection(db, "support_tickets", id, "messages"), orderBy("createdAt", "asc"));
            unsubscribeMessages = onSnapshot(msgQ, (snap) => {
                const historyEl = document.getElementById('messageHistory');
                if (!historyEl) return;
                historyEl.innerHTML = '';
                
                const initialTime = ticket.createdAt?.toDate ? ticket.createdAt.toDate().toLocaleTimeString('pt-MZ', {hour: '2-digit', minute:'2-digit'}) : '';
                historyEl.innerHTML += `
                    <div class="flex flex-col msg-client max-w-[85%] p-3 text-sm shadow-md">
                        <p class="whitespace-pre-wrap leading-relaxed">${escapeHTML(ticket.message || '')}</p>
                        <span class="text-[9px] text-slate-400 self-end mt-1 opacity-70">${initialTime}</span>
                    </div>`;

                snap.forEach(docMsg => {
                    const m = docMsg.data();
                    const time = m.createdAt?.toDate ? m.createdAt.toDate().toLocaleTimeString('pt-MZ', {hour: '2-digit', minute:'2-digit'}) : '';
                    const isAdmin = m.sender === 'admin';
                    const cssClass = isAdmin ? 'msg-admin' : 'msg-client';
                    
                    let attachHtml = '';
                    if (m.attachmentUrl) {
                        const isImage = /\.(jpg|jpeg|png|gif|webp)$/i.test(m.attachmentUrl);
                        attachHtml = isImage 
                            ? `<img src="${m.attachmentUrl}" alt="Anexo" class="max-w-full rounded-lg mt-2 border border-white/10" loading="lazy">`
                            : `<a href="${m.attachmentUrl}" target="_blank" class="block mb-2 mt-1 px-3 py-2 bg-black/20 rounded-lg text-xs font-bold hover:bg-black/30 transition flex items-center gap-2"><i data-lucide="paperclip" class="w-3 h-3"></i> Ver Anexo</a>`;
                    }

                    historyEl.innerHTML += `
                        <div class="flex flex-col ${cssClass} max-w-[85%] p-3 text-sm shadow-md">
                            ${attachHtml}
                            <p class="whitespace-pre-wrap leading-relaxed">${escapeHTML(m.text || '')}</p>
                            <span class="text-[9px] ${isAdmin ? 'text-blue-200' : 'text-slate-400'} self-end mt-1 opacity-70">${time}</span>
                        </div>`;
                });
                
                if (typeof lucide !== 'undefined') lucide.createIcons({root: historyEl});
                setTimeout(() => { if (historyEl) historyEl.scrollTop = historyEl.scrollHeight; }, 50);
            });
        };

        window.closeMobileChat = () => {
            document.getElementById('chatArea')?.classList.add('hidden');
            document.getElementById('chatArea')?.classList.remove('flex');
            activeTicketId = null; renderTicketList();
        };

        // ==========================================
        // 🟢 ATUALIZAR STATUS DO TICKET (+ NOTIFICAR CLIENTE)
        // ==========================================
        window.updateTicketStatus = async (newStatus) => {
            if (!activeTicketId) return;
            const ticket = allTickets.find(t => t.id === activeTicketId);
            if (!ticket) return;

            try {
                await updateDoc(doc(db, "support_tickets", activeTicketId), { 
                    status: newStatus, updatedAt: serverTimestamp() 
                });
                const statusText = newStatus === 'closed' ? 'Fechado' : newStatus === 'in_progress' ? 'Em Análise' : 'Pendente';
                showToast(`Status atualizado: ${statusText}`, 'success');

                // 🌟 A PONTE DE COMUNICAÇÃO: Notificar cliente da mudança
                if (ticket.userId) {
                    await addDoc(collection(db, "notifications"), {
                        userId: ticket.userId,
                        title: "Atualização no Suporte 🎫",
                        message: `O seu ticket de suporte passou para o estado: ${statusText}.`,
                        type: "alert",
                        read: false,
                        createdAt: serverTimestamp()
                    });
                }
            } catch (e) { showToast("Erro ao atualizar status.", "error"); }
        };

        // ==========================================
        // 📎 UPLOAD DE FICHEIRO
        // ==========================================
        window.handleFileSelect = (e) => {
            selectedFile = e.target.files?.[0];
            if (selectedFile) {
                if (selectedFile.size > 10 * 1024 * 1024) {
                    showToast('Ficheiro muito grande. Máximo 10MB.', 'warning');
                    e.target.value = ''; selectedFile = null; return;
                }
                document.getElementById('fileBadge')?.classList.remove('hidden');
                document.getElementById('fileNameDisplay')?.classList.remove('hidden');
                document.getElementById('fileNameDisplay').textContent = `📎 ${selectedFile.name}`;
            } else {
                document.getElementById('fileBadge')?.classList.add('hidden');
                document.getElementById('fileNameDisplay')?.classList.add('hidden');
            }
        };

        // ==========================================
        // 📤 ENVIAR RESPOSTA (+ NOTIFICAR CLIENTE)
        // ==========================================
        document.getElementById('replyForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!activeTicketId) return;

            const ticket = allTickets.find(t => t.id === activeTicketId);
            if (!ticket) return;

            const input = document.getElementById('replyMessage');
            const text = input.value.trim();
            if (!text && !selectedFile) return;

            const btn = document.getElementById('btnSendReply');
            const originalBtn = btn.innerHTML;
            btn.disabled = true; btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i>`; 
            if (typeof lucide !== 'undefined') lucide.createIcons({root: btn});

            try {
                let attachmentUrl = null;

                if (selectedFile) {
                    const fileRef = ref(storage, `ticket_attachments/${activeTicketId}/${Date.now()}_${selectedFile.name.replace(/[^a-zA-Z0-9.-]/g, '_')}`);
                    await uploadBytes(fileRef, selectedFile);
                    attachmentUrl = await getDownloadURL(fileRef);
                }

                // 1. Gravar Mensagem na Base de Dados
                await addDoc(collection(db, "support_tickets", activeTicketId, "messages"), {
                    sender: 'admin', text: text, attachmentUrl: attachmentUrl,
                    createdAt: serverTimestamp(), adminId: currentAdmin?.uid
                });

                // 2. Atualizar estado do ticket para Em Progresso (se o Admin respondeu, está ativo)
                await updateDoc(doc(db, "support_tickets", activeTicketId), {
                    updatedAt: serverTimestamp(), status: document.getElementById('ticketStatusSelect').value
                });

                // 🌟 A PONTE DE COMUNICAÇÃO: Disparar notificação para o Sino do Cliente
                if (ticket.userId) {
                    await addDoc(collection(db, "notifications"), {
                        userId: ticket.userId,
                        title: "Nova Mensagem de Suporte 💬",
                        message: "A Equipa PayGo respondeu ao seu ticket de suporte. Vá à central de mensagens para ler.",
                        type: "message", // Aciona o sino normal no lado do cliente
                        read: false,
                        createdAt: serverTimestamp()
                    });
                }

                // Limpar campos
                input.value = ''; input.style.height = ''; selectedFile = null;
                document.getElementById('fileUpload').value = '';
                document.getElementById('fileBadge')?.classList.add('hidden');
                document.getElementById('fileNameDisplay')?.classList.add('hidden');

            } catch (err) { showToast("Erro ao enviar mensagem.", "error"); } 
            finally { btn.disabled = false; btn.innerHTML = originalBtn; if (typeof lucide !== 'undefined') lucide.createIcons({root: btn}); }
        });

        // ==========================================
        // ⌨️ ATALHOS DE TECLADO
        // ==========================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') window.closeMobileChat();
            if (e.key === 'Enter' && e.ctrlKey && !e.shiftKey) { e.preventDefault(); document.getElementById('replyForm')?.requestSubmit(); }
        });

        window.addEventListener('beforeunload', () => { if (unsubscribeMessages) unsubscribeMessages(); });

    </script>
</body>
</html>
