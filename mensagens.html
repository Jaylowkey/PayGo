<!DOCTYPE html>
<html lang="pt-MZ" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Central de Ajuda | PayGo</title>
    <meta name="theme-color" content="#0f172a">
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'], display: ['"Outfit"', 'sans-serif'], mono: ['"Fira Code"', 'monospace'] },
                    colors: { 
                        brand: { 50: '#eff6ff', 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a', 950: '#0f172a' },
                        success: { 400: '#4ade80', 500: '#22c55e' }, warning: { 400: '#fbbf24', 500: '#f59e0b' }, danger: { 400: '#f87171', 500: '#ef4444' }
                    }
                }
            }
        };
    </script>
    
    <style>
        body { background-color: #0f172a; color: #f8fafc; overflow: hidden; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .bg-grid { background-size: 40px 40px; background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px); }
        .glass-nav { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,255,255,0.08); }
        .glass-card { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); }
        
        .chat-scroll { overflow-y: auto; scroll-behavior: smooth; }
        .ticket-item { transition: all 0.2s ease; border-left: 3px solid transparent; }
        .ticket-item:hover { background: rgba(59, 130, 246, 0.05); }
        .ticket-item.active { background: rgba(59, 130, 246, 0.15); border-left-color: #3b82f6; }
        
        .msg-client { background: linear-gradient(135deg, #2563eb, #3b82f6); color: white; border-radius: 16px 16px 4px 16px; align-self: flex-end; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
        .msg-admin { background: #1e293b; color: #e2e8f0; border-radius: 16px 16px 16px 4px; align-self: flex-start; border: 1px solid rgba(255,255,255,0.05); }
        
        #toastContainer { position: fixed; top: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast { pointer-events: auto; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px); border-left: 4px solid #3b82f6; padding: 16px 20px; border-radius: 12px; display: flex; align-items: center; gap: 12px; transform: translateX(120%); transition: transform 0.4s ease; opacity: 0; }
        .toast.show { transform: translateX(0); opacity: 1; }
        .toast.error { border-left-color: #ef4444; }
    </style>
</head>
<body class="selection:bg-brand-500 selection:text-white flex flex-col h-screen relative">

    <div class="fixed inset-0 bg-grid opacity-20 pointer-events-none z-0"></div>
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[600px] h-[500px] bg-brand-600/10 rounded-full mix-blend-screen blur-[120px] pointer-events-none z-0"></div>
    <div id="toastContainer"></div>

    <header class="w-full z-50 glass-nav shrink-0">
        <div class="container mx-auto px-4 md:px-6 h-16 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <a href="dashboard.html" class="text-slate-400 hover:text-white transition p-2 rounded-lg hover:bg-white/10" title="Voltar">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </a>
                <div class="bg-brand-500/20 text-brand-400 p-2 rounded-lg hidden sm:block">
                    <i data-lucide="life-buoy" class="w-4 h-4"></i>
                </div>
                <span class="text-xl font-display font-bold text-white">Central de Ajuda</span>
            </div>
            <div class="flex items-center gap-3">
                <a href="notificacoes.html" class="p-2 text-slate-400 hover:text-white transition rounded-lg hover:bg-white/10">
                    <i data-lucide="bell" class="w-5 h-5"></i>
                </a>
            </div>
        </div>
    </header>

    <main class="flex-1 container mx-auto px-2 sm:px-6 py-6 relative z-10 flex overflow-hidden">
        <div class="flex w-full h-full glass-card rounded-2xl overflow-hidden shadow-2xl">
            
            <div class="w-full md:w-1/3 flex flex-col border-r border-slate-700/50 bg-slate-900/50 shrink-0" id="ticketSidebar">
                <div class="p-4 border-b border-slate-700/50 flex justify-between items-center bg-slate-900/80">
                    <h3 class="text-sm font-bold text-white uppercase tracking-widest">Meus Pedidos</h3>
                    <button onclick="window.location.href='dashboard.html'" class="text-xs bg-brand-600 hover:bg-brand-500 text-white px-3 py-1.5 rounded-lg font-bold transition flex items-center gap-1">
                        <i data-lucide="plus" class="w-3 h-3"></i> Novo
                    </button>
                </div>

                <div class="flex-1 chat-scroll" id="ticketList">
                    <div class="p-8 text-center text-slate-500"><i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto"></i></div>
                </div>
            </div>

            <div class="hidden md:flex flex-col flex-1 bg-slate-950 relative" id="chatArea">
                
                <div id="emptyChatState" class="absolute inset-0 flex flex-col items-center justify-center text-center p-6 z-20 bg-slate-950">
                    <div class="w-20 h-20 bg-slate-900 rounded-full flex items-center justify-center mb-4 text-brand-500/50 shadow-inner">
                        <i data-lucide="messages-square" class="w-10 h-10"></i>
                    </div>
                    <h3 class="text-xl font-bold text-white mb-2">Selecione uma conversa</h3>
                    <p class="text-slate-500 text-sm max-w-sm">Acompanhe os seus pedidos de suporte, reembolsos ou recargas de cartão virtual aqui.</p>
                </div>

                <div class="p-4 border-b border-slate-800 bg-slate-900/80 flex justify-between items-center shrink-0">
                    <div class="flex items-center gap-3">
                        <button class="md:hidden text-slate-400 hover:text-white p-1 transition" onclick="window.closeMobileChat()">
                            <i data-lucide="chevron-left" class="w-6 h-6"></i>
                        </button>
                        <div class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center text-brand-400 font-bold border border-slate-700">
                            <i data-lucide="headphones" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <h3 class="font-bold text-white leading-tight">Equipa PayGo</h3>
                            <p class="text-[11px] text-success-400 font-bold uppercase tracking-widest flex items-center gap-1" id="chatTicketStatus">
                                <span class="w-2 h-2 rounded-full bg-success-500 animate-pulse"></span> Suporte Oficial
                            </p>
                        </div>
                    </div>
                    <div>
                        <span id="chatTicketType" class="px-2.5 py-1 rounded text-[10px] font-bold uppercase tracking-widest bg-slate-800 text-slate-300 border border-slate-700">TICKET</span>
                    </div>
                </div>

                <div class="flex-1 chat-scroll p-4 md:p-6 space-y-4 flex flex-col" id="messageHistory">
                </div>

                <div class="p-4 bg-slate-900 border-t border-slate-800 shrink-0">
                    <form id="replyForm" class="flex items-end gap-2 relative">
                        <div class="relative shrink-0">
                            <input type="file" id="fileUpload" class="hidden" accept="image/*, .pdf, .doc, .docx" onchange="window.handleFileSelect(event)">
                            <button type="button" onclick="document.getElementById('fileUpload').click()" class="w-12 h-12 rounded-xl bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-400 hover:text-brand-400 transition">
                                <i data-lucide="paperclip" class="w-5 h-5"></i>
                            </button>
                            <div id="fileBadge" class="absolute -top-2 -right-2 w-4 h-4 bg-success-500 rounded-full hidden border-2 border-slate-900"></div>
                        </div>

                        <div class="flex-1 bg-slate-950 border border-slate-700 rounded-xl relative focus-within:border-brand-500 transition-colors">
                            <textarea id="replyMessage" rows="1" class="w-full bg-transparent text-white px-4 py-3 outline-none resize-none text-sm max-h-32 min-h-[48px] chat-scroll" placeholder="Escreva a sua mensagem..." oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'"></textarea>
                        </div>

                        <button type="submit" id="btnSendReply" class="w-12 h-12 rounded-xl bg-brand-600 hover:bg-brand-500 flex items-center justify-center text-white transition shadow-lg shrink-0">
                            <i data-lucide="send" class="w-5 h-5 ml-1"></i>
                        </button>
                    </form>
                    <div id="fileNameDisplay" class="text-[10px] text-brand-400 mt-2 font-mono hidden truncate px-1"></div>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        // 🚀 Nota tática: O cliente vai organizar as datas localmente no JS para evitar bloqueios do Firebase!
        import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc, addDoc, serverTimestamp, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAHxyX5e9O8qQo6Z3VHURgVXhxbxSp0Qh8",
            authDomain: "paygo-14311.firebaseapp.com",
            projectId: "paygo-14311",
            storageBucket: "paygo-14311.firebasestorage.app",
            messagingSenderId: "208360646277",
            appId: "1:208360646277:web:aecc57cc0077ae48a52bec"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app, "paygodb");
        const storage = getStorage(app);

        lucide.createIcons();

        let currentUser = null;
        let myTickets = [];
        let activeTicketId = null;
        let unsubscribeMessages = null;
        let selectedFile = null;

        const escapeHTML = (str) => {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        };

        window.showToast = function(msg, type = 'success') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const t = document.createElement('div');
            const borderColor = type === 'error' ? 'border-danger-500' : 'border-brand-500';
            const icon = type === 'error' ? 'alert-octagon text-danger-400' : 'check-check text-brand-400';
            t.className = `toast border-l-4 ${borderColor} bg-slate-900/95`;
            t.innerHTML = `<i data-lucide="${icon.split(' ')[0]}" class="w-5 h-5 ${icon.split(' ')[1]}"></i> <span class="text-sm font-bold text-white">${escapeHTML(msg)}</span>`;
            container.appendChild(t); lucide.createIcons({ root: t });
            requestAnimationFrame(() => { t.classList.remove('translate-x-full', 'opacity-0'); });
            setTimeout(() => { t.classList.add('opacity-0', 'translate-x-8'); setTimeout(() => t.remove(), 400); }, 4000);
        };

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'login.html'; return; }
            currentUser = user;
            loadMyTickets();
        });

        // 📥 CARREGAR OS TICKETS DO CLIENTE
        function loadMyTickets() {
            const q = query(collection(db, "support_tickets"), where("userId", "==", currentUser.uid));
            
            onSnapshot(q, (snapshot) => {
                myTickets = [];
                snapshot.forEach((docSnap) => {
                    myTickets.push({ id: docSnap.id, ...docSnap.data() });
                });

                // Ordenação Local para evitar erros de índice no Firebase!
                myTickets.sort((a, b) => {
                    const tA = a.updatedAt?.seconds || a.createdAt?.seconds || 0;
                    const tB = b.updatedAt?.seconds || b.createdAt?.seconds || 0;
                    return tB - tA; 
                });

                renderTicketList();
            }, (error) => {
                showToast("Erro ao ligar ao centro de ajuda.", "error");
            });
        }

        function renderTicketList() {
            const listEl = document.getElementById('ticketList');
            listEl.innerHTML = '';

            if (myTickets.length === 0) {
                listEl.innerHTML = `
                    <div class="p-6 text-center text-slate-500 text-sm flex flex-col items-center gap-2 mt-10">
                        <i data-lucide="life-buoy" class="w-10 h-10 opacity-30 text-brand-500"></i>
                        <span>Sem pedidos de ajuda.</span>
                        <a href="dashboard.html" class="text-brand-400 hover:underline mt-2">Criar Novo Ticket</a>
                    </div>`;
                lucide.createIcons({root: listEl}); return;
            }

            myTickets.forEach(ticket => {
                const dateStr = ticket.createdAt?.toDate ? ticket.createdAt.toDate().toLocaleDateString('pt-MZ') : 'Recente';
                const isActive = activeTicketId === ticket.id ? 'active' : '';
                
                // Status visual
                let statusDot = '';
                if(ticket.status === 'open') statusDot = '<div class="w-2 h-2 rounded-full bg-warning-500 shadow-[0_0_8px_rgba(245,158,11,0.8)]" title="Pendente"></div>';
                else if (ticket.status === 'in_progress') statusDot = '<div class="w-2 h-2 rounded-full bg-brand-500 shadow-[0_0_8px_rgba(59,130,246,0.8)] animate-pulse" title="Em Análise"></div>';
                else statusDot = '<div class="w-2 h-2 rounded-full bg-success-500" title="Fechado"></div>';

                let typeBadge = '';
                if (ticket.type === 'refund') typeBadge = `<span class="text-[8px] px-1.5 py-0.5 rounded bg-danger-500/20 text-danger-400 border border-danger-500/30">REEMBOLSO</span>`;
                else if (ticket.type === 'vc_topup') typeBadge = `<span class="text-[8px] px-1.5 py-0.5 rounded bg-success-500/20 text-success-400 border border-success-500/30">RECARGA VC</span>`;
                else typeBadge = `<span class="text-[8px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">MENSAGEM</span>`;

                const div = document.createElement('div');
                div.className = `ticket-item p-4 border-b border-slate-800/50 cursor-pointer hover:bg-slate-800/30 transition flex items-center gap-3 ${isActive}`;
                div.onclick = () => selectTicket(ticket.id);
                
                div.innerHTML = `
                    <div class="shrink-0 flex items-center justify-center">${statusDot}</div>
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-start mb-1">
                            <div class="flex items-center gap-2">${typeBadge} <span class="text-xs font-bold text-white">#${ticket.orderId ? escapeHTML(ticket.orderId) : 'SUPORTE'}</span></div>
                            <span class="text-[9px] text-slate-500 whitespace-nowrap">${dateStr}</span>
                        </div>
                        <p class="text-xs text-slate-400 truncate pr-2">${escapeHTML(ticket.message || 'Ver Detalhes...')}</p>
                    </div>
                `;
                listEl.appendChild(div);
            });
            lucide.createIcons({root: listEl});
        }

        // 💬 ABRIR CHAT
        window.selectTicket = async (id) => {
            activeTicketId = id;
            
            // Lógica Mobile
            document.getElementById('ticketSidebar').classList.add('hidden', 'md:flex');
            const chatArea = document.getElementById('chatArea');
            chatArea.classList.remove('hidden'); chatArea.classList.add('flex');

            renderTicketList();

            const ticket = myTickets.find(t => t.id === id);
            if (!ticket) return;

            document.getElementById('emptyChatState')?.classList.add('hidden');
            
            const mainBadge = document.getElementById('chatTicketType');
            if (ticket.type === 'refund') { mainBadge.className = "px-2.5 py-1 rounded text-[10px] font-bold uppercase tracking-widest bg-danger-500/20 text-danger-400 border border-danger-500/30"; mainBadge.textContent = "REEMBOLSO"; }
            else if (ticket.type === 'vc_topup') { mainBadge.className = "px-2.5 py-1 rounded text-[10px] font-bold uppercase tracking-widest bg-success-500/20 text-success-400 border border-success-500/30"; mainBadge.textContent = "RECARGA VC"; }
            else { mainBadge.className = "px-2.5 py-1 rounded text-[10px] font-bold uppercase tracking-widest bg-slate-800 text-slate-300 border border-slate-700"; mainBadge.textContent = "MENSAGEM GERAL"; }

            if (unsubscribeMessages) unsubscribeMessages();
            
            // 🚀 Aqui o cliente carrega AS MENSAGENS, ordenando-as sem precisar de índice porque não usa 'where' misturado!
            const msgRef = collection(db, "support_tickets", id, "messages");
            unsubscribeMessages = onSnapshot(msgRef, (snap) => {
                const historyEl = document.getElementById('messageHistory');
                if (!historyEl) return;
                historyEl.innerHTML = '';
                
                // Mensagem Principal do Cliente
                const initialTime = ticket.createdAt?.toDate ? ticket.createdAt.toDate().toLocaleTimeString('pt-MZ', {hour: '2-digit', minute:'2-digit'}) : '';
                historyEl.innerHTML += `
                    <div class="flex flex-col msg-client max-w-[85%] p-3 text-sm shadow-md">
                        <p class="whitespace-pre-wrap leading-relaxed">${escapeHTML(ticket.message || '')}</p>
                        <span class="text-[9px] text-blue-200 self-end mt-1 opacity-70">${initialTime}</span>
                    </div>`;

                let msgsArray = [];
                snap.forEach(docMsg => msgsArray.push(docMsg.data()));
                msgsArray.sort((a,b) => (a.createdAt?.seconds||0) - (b.createdAt?.seconds||0)); // Ordena localmente a ordem de conversa

                msgsArray.forEach(m => {
                    const time = m.createdAt?.toDate ? m.createdAt.toDate().toLocaleTimeString('pt-MZ', {hour: '2-digit', minute:'2-digit'}) : '';
                    const isClient = m.sender !== 'admin'; // Cliente enviou = msg-client (azul à direita). Admin = msg-admin (cinza à esquerda)
                    const cssClass = isClient ? 'msg-client' : 'msg-admin';
                    
                    let attachHtml = '';
                    if (m.attachmentUrl) {
                        const isImage = /\.(jpg|jpeg|png|gif|webp)$/i.test(m.attachmentUrl);
                        attachHtml = isImage 
                            ? `<img src="${m.attachmentUrl}" alt="Anexo" class="max-w-full rounded-lg mt-2 border border-white/10" loading="lazy">`
                            : `<a href="${m.attachmentUrl}" target="_blank" class="block mb-2 mt-1 px-3 py-2 bg-black/20 rounded-lg text-xs font-bold hover:bg-black/30 transition flex items-center gap-2"><i data-lucide="paperclip" class="w-3 h-3"></i> Ver Anexo</a>`;
                    }

                    historyEl.innerHTML += `
                        <div class="flex flex-col ${cssClass} max-w-[85%] p-3 text-sm shadow-md">
                            ${attachHtml}
                            <p class="whitespace-pre-wrap leading-relaxed">${escapeHTML(m.text || '')}</p>
                            <span class="text-[9px] ${isClient ? 'text-blue-200' : 'text-slate-400'} self-end mt-1 opacity-70">${time}</span>
                        </div>`;
                });
                
                lucide.createIcons({root: historyEl});
                setTimeout(() => { if (historyEl) historyEl.scrollTop = historyEl.scrollHeight; }, 50);
            });
        };

        window.closeMobileChat = () => {
            document.getElementById('chatArea').classList.add('hidden');
            document.getElementById('chatArea').classList.remove('flex');
            document.getElementById('ticketSidebar').classList.remove('hidden');
            activeTicketId = null; renderTicketList();
        };

        // 📎 UPLOAD
        window.handleFileSelect = (e) => {
            selectedFile = e.target.files?.[0];
            if (selectedFile) {
                if (selectedFile.size > 5 * 1024 * 1024) { showToast('Ficheiro muito grande. Max 5MB.', 'error'); e.target.value = ''; selectedFile = null; return; }
                document.getElementById('fileBadge')?.classList.remove('hidden');
                document.getElementById('fileNameDisplay')?.classList.remove('hidden');
                document.getElementById('fileNameDisplay').textContent = `📎 ${selectedFile.name}`;
            } else {
                document.getElementById('fileBadge')?.classList.add('hidden');
                document.getElementById('fileNameDisplay')?.classList.add('hidden');
            }
        };

        // 📤 ENVIAR RESPOSTA (CLIENTE -> ADMIN)
        document.getElementById('replyForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!activeTicketId) return;

            const input = document.getElementById('replyMessage');
            const text = input.value.trim();
            if (!text && !selectedFile) return;

            const btn = document.getElementById('btnSendReply');
            const originalBtn = btn.innerHTML;
            btn.disabled = true; btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i>`; 

            try {
                let attachmentUrl = null;
                if (selectedFile) {
                    const fileRef = ref(storage, `ticket_attachments/${activeTicketId}/${Date.now()}_${selectedFile.name.replace(/[^a-zA-Z0-9.-]/g, '_')}`);
                    await uploadBytes(fileRef, selectedFile);
                    attachmentUrl = await getDownloadURL(fileRef);
                }

                // Cliente escreve na subcoleção e o Admin lê
                await addDoc(collection(db, "support_tickets", activeTicketId, "messages"), {
                    sender: currentUser.uid, text: text, attachmentUrl: attachmentUrl, createdAt: serverTimestamp()
                });

                // Atualizamos o ticket para o topo da fila do Admin
                await updateDoc(doc(db, "support_tickets", activeTicketId), {
                    status: 'open', updatedAt: serverTimestamp() // Volta a ficar 'open' para o Admin ver
                });

                input.value = ''; input.style.height = ''; selectedFile = null;
                document.getElementById('fileUpload').value = '';
                document.getElementById('fileBadge')?.classList.add('hidden');
                document.getElementById('fileNameDisplay')?.classList.add('hidden');

            } catch (err) { showToast("Falha técnica ao enviar.", "error"); } 
            finally { btn.disabled = false; btn.innerHTML = originalBtn; lucide.createIcons({root: btn}); }
        });

    </script>
</body>
</html>
