<!DOCTYPE html>
<html lang="pt-MZ" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notificações | PayGo Moçambique</title>
    <meta name="theme-color" content="#0f172a">
    <meta name="robots" content="noindex, nofollow">
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'], 
                        display: ['"Outfit"', 'sans-serif'], 
                        mono: ['"Fira Code"', 'monospace'] 
                    },
                    colors: { 
                        brand: { 50: '#eff6ff', 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a', 950: '#0f172a' },
                        success: { 400: '#4ade80', 500: '#22c55e', 900: '#14532d' }, 
                        warning: { 400: '#fbbf24', 500: '#f59e0b', 900: '#78350f' }, 
                        danger: { 400: '#f87171', 500: '#ef4444', 900: '#7f1d1d' }, 
                        vip: { 400: '#c084fc', 500: '#a855f7', 600: '#9333ea' } 
                    }
                }
            }
        };
    </script>
    
    <style>
        body { background-color: #0f172a; color: #f8fafc; -webkit-font-smoothing: antialiased; }
        ::-webkit-scrollbar { width: 6px; } 
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        
        .bg-grid { background-size: 40px 40px; background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px); }
        .glass-nav { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,255,255,0.08); z-index: 50; }
        .glass-card { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); transition: all 0.3s ease; }
        
        .notification-unread {
            background: linear-gradient(to right, rgba(59, 130, 246, 0.05), rgba(30, 41, 59, 0.4));
            border-left: 4px solid #3b82f6;
        }
        
        .notification-read {
            background: rgba(30, 41, 59, 0.2);
            border-left: 4px solid transparent;
            opacity: 0.8;
        }

        #toastContainer { position: fixed; top: 24px; right: 24px; z-index: 99999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        
        .skeleton { background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    </style>
</head>
<body class="selection:bg-brand-500 selection:text-white">

    <div class="fixed inset-0 bg-grid opacity-20 pointer-events-none z-0"></div>
    <div class="fixed top-0 right-0 w-[500px] h-[500px] bg-brand-600/10 rounded-full mix-blend-screen blur-[120px] pointer-events-none z-0"></div>
    <div id="toastContainer" role="region" aria-label="Notificações"></div>

    <header class="fixed w-full z-50 glass-nav">
        <div class="container mx-auto px-4 md:px-6 h-20 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <a href="dashboard.html" class="bg-slate-800 hover:bg-slate-700 text-slate-300 p-2.5 rounded-xl transition-colors border border-slate-700 hover:border-slate-500 flex items-center justify-center">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </a>
                <span class="text-xl font-display font-bold text-white">Notificações</span>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2">
                    <a href="dashboard.html" class="bg-slate-800 hover:bg-brand-500/20 text-slate-400 hover:text-brand-400 rounded-xl p-2.5 transition-colors border border-transparent hover:border-brand-500/30" title="Meu Painel">
                        <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main class="pt-28 pb-20 relative z-10 container mx-auto px-4 md:px-6 max-w-4xl min-h-screen">
        
        <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 mb-8 relative z-10">
            <div>
                <h1 class="text-3xl md:text-4xl font-display font-extrabold text-white tracking-tight">Centro de Alertas</h1>
                <p class="text-slate-400 mt-2 text-sm">Acompanhe todas as atualizações da sua conta e pagamentos.</p>
            </div>
            <button onclick="window.markAllAsRead()" id="btnMarkAll" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-5 py-2.5 rounded-xl text-sm font-bold transition-colors border border-slate-700 hover:border-slate-500 flex items-center justify-center gap-2 shadow-sm disabled:opacity-50">
                <i data-lucide="check-check" class="w-4 h-4"></i> Marcar todas como lidas
            </button>
        </div>

        <div class="glass-card rounded-3xl border border-slate-800 overflow-hidden shadow-2xl relative z-10">
            
            <div id="loadingState" class="divide-y divide-white/5">
                <div class="p-6 flex gap-4">
                    <div class="w-12 h-12 rounded-full skeleton shrink-0"></div>
                    <div class="w-full space-y-3">
                        <div class="h-4 skeleton w-1/3"></div>
                        <div class="h-3 skeleton w-2/3"></div>
                    </div>
                </div>
                <div class="p-6 flex gap-4">
                    <div class="w-12 h-12 rounded-full skeleton shrink-0"></div>
                    <div class="w-full space-y-3">
                        <div class="h-4 skeleton w-1/4"></div>
                        <div class="h-3 skeleton w-1/2"></div>
                    </div>
                </div>
            </div>

            <div id="notificationsList" class="divide-y divide-white/5 hidden">
                </div>

            <div id="emptyState" class="hidden p-16 text-center">
                <div class="w-20 h-20 bg-slate-800/50 rounded-full flex items-center justify-center mx-auto mb-6 border border-slate-700/50">
                    <i data-lucide="bell-off" class="w-8 h-8 text-slate-500"></i>
                </div>
                <h3 class="text-xl font-display font-bold text-white mb-2">Tudo em dia!</h3>
                <p class="text-slate-400 text-sm">Você não tem notificações novas no momento.</p>
            </div>
            
        </div>
    </main>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, query, where, orderBy, onSnapshot, doc, updateDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // 🔥 AS TUAS CHAVES (Mantém intactas)
        const firebaseConfig = { 
            apiKey: "AIzaSyAHxyX5e9O8qQo6Z3VHURgVXhxbxSp0Qh8", 
            authDomain: "paygo-14311.firebaseapp.com", 
            projectId: "paygo-14311", 
            storageBucket: "paygo-14311.firebasestorage.app", 
            messagingSenderId: "208360646277", 
            appId: "1:208360646277:web:aecc57cc0077ae48a52bec" 
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app, "paygodb");
        lucide.createIcons();

        let currentUser = null;
        let unreadDocs = []; // Guarda as referências para marcar todas como lidas de uma vez

        // =====================================
        // 🛠️ FUNÇÕES UTILITÁRIAS
        // =====================================
        window.showToast = function(msg, type = 'success') {
            const container = document.getElementById('toastContainer');
            if(!container) return;
            const t = document.createElement('div');
            const bg = type === 'error' ? 'bg-danger-500/95 border-danger-400' : type === 'warning' ? 'bg-warning-500/95 border-warning-400' : 'bg-slate-900/95 border-brand-500';
            const icon = type === 'error' ? 'alert-octagon text-danger-400' : type === 'warning' ? 'alert-triangle text-warning-400' : 'check-check text-brand-400';
            t.className = `flex items-center gap-3 px-5 py-4 rounded-2xl shadow-2xl border ${bg} transform transition-all translate-x-full opacity-0`;
            t.innerHTML = `<i data-lucide="${icon.split(' ')[0]}" class="w-5 h-5 ${icon.split(' ')[1]}"></i> <span class="text-sm font-bold text-white">${msg}</span>`;
            container.appendChild(t); lucide.createIcons({ root: t });
            requestAnimationFrame(() => { t.classList.remove('translate-x-full', 'opacity-0'); });
            setTimeout(() => { t.classList.add('opacity-0', 'translate-x-8'); setTimeout(() => t.remove(), 400); }, 4000);
        };

        const formatDate = (timestamp) => {
            if(!timestamp) return 'Agora mesmo';
            const date = timestamp.toDate();
            return date.toLocaleDateString('pt-MZ', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
        };

        // Estilização dinâmica por tipo de alerta
        const getNotificationStyle = (type) => {
            switch(type) {
                case 'deposit': return { icon: 'wallet', color: 'text-success-400', bg: 'bg-success-500/20', border: 'border-success-500/30' };
                case 'order_update': return { icon: 'package', color: 'text-brand-400', bg: 'bg-brand-500/20', border: 'border-brand-500/30' };
                case 'alert': return { icon: 'alert-triangle', color: 'text-warning-400', bg: 'bg-warning-500/20', border: 'border-warning-500/30' };
                case 'error': return { icon: 'x-octagon', color: 'text-danger-400', bg: 'bg-danger-500/20', border: 'border-danger-500/30' };
                case 'vip': return { icon: 'crown', color: 'text-vip-400', bg: 'bg-vip-500/20', border: 'border-vip-500/30' };
                default: return { icon: 'bell', color: 'text-slate-400', bg: 'bg-slate-800', border: 'border-slate-700' };
            }
        };

        // =====================================
        // 📡 OUVINTE EM TEMPO REAL (ON SNAPSHOT)
        // =====================================
        onAuthStateChanged(auth, (user) => {
            if (!user) { window.location.href = 'login.html'; return; }
            currentUser = user;

            // Fica à escuta da coleção 'notifications' do cliente específico, ordenadas da mais recente para a mais antiga
            const q = query(collection(db, "notifications"), where("userId", "==", user.uid), orderBy("createdAt", "desc"));
            
            onSnapshot(q, (snapshot) => {
                const listEl = document.getElementById('notificationsList');
                const emptyEl = document.getElementById('emptyState');
                const loadingEl = document.getElementById('loadingState');
                const btnMarkAll = document.getElementById('btnMarkAll');

                // Esconde o Skeleton Loader
                loadingEl.classList.add('hidden');
                unreadDocs = [];

                if (snapshot.empty) {
                    listEl.classList.add('hidden');
                    emptyEl.classList.remove('hidden');
                    btnMarkAll.disabled = true;
                    return;
                }

                listEl.classList.remove('hidden');
                emptyEl.classList.add('hidden');
                
                let html = '';
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    const id = docSnap.id;
                    const isRead = data.read === true;
                    
                    if (!isRead) unreadDocs.push(docSnap.ref);

                    const style = getNotificationStyle(data.type);
                    const readClass = isRead ? 'notification-read' : 'notification-unread';
                    const cursorClass = isRead ? '' : 'cursor-pointer hover:bg-slate-800/40 transition-colors';
                    const onclickAction = !isRead ? `onclick="window.markAsRead('${id}')"` : '';

                    html += `
                        <div class="p-6 flex flex-col sm:flex-row gap-4 sm:items-start relative ${readClass} ${cursorClass}" ${onclickAction}>
                            ${!isRead ? `<div class="absolute top-6 right-6 w-2 h-2 bg-brand-500 rounded-full shadow-[0_0_8px_rgba(59,130,246,0.8)] animate-pulse"></div>` : ''}
                            
                            <div class="w-12 h-12 rounded-full flex items-center justify-center shrink-0 border ${style.bg} ${style.border}">
                                <i data-lucide="${style.icon}" class="w-5 h-5 ${style.color}"></i>
                            </div>
                            
                            <div class="flex-1 pr-6">
                                <h4 class="text-base font-bold text-white mb-1 leading-tight">${data.title}</h4>
                                <p class="text-sm text-slate-400 leading-relaxed mb-2">${data.message}</p>
                                <p class="text-[10px] uppercase tracking-widest font-bold text-slate-500">${formatDate(data.createdAt)}</p>
                            </div>
                        </div>
                    `;
                });

                listEl.innerHTML = html;
                btnMarkAll.disabled = unreadDocs.length === 0;
                lucide.createIcons();
            }, (error) => {
                console.error("Erro ao escutar notificações:", error);
                window.showToast("Falha técnica ao carregar notificações.", "error");
            });
        });

        // =====================================
        // 🎯 AÇÕES DE LEITURA E LOGOUT
        // =====================================
        window.markAsRead = async (id) => {
            try {
                await updateDoc(doc(db, "notifications", id), { read: true });
            } catch(e) { console.error("Erro ao marcar como lida:", e); }
        };

        window.markAllAsRead = async () => {
            if (unreadDocs.length === 0) return;
            const btn = document.getElementById('btnMarkAll');
            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Atualizando...`;
            lucide.createIcons({root: btn});

            try {
                // writeBatch permite atualizar centenas de docs de uma só vez numa única transação à DB
                const batch = writeBatch(db);
                unreadDocs.forEach(ref => {
                    batch.update(ref, { read: true });
                });
                await batch.commit();
                window.showToast("Todas as notificações marcadas como lidas!", "success");
            } catch(e) {
                console.error("Erro no batch:", e);
                window.showToast("Falha ao atualizar dados.", "error");
            } finally {
                btn.innerHTML = `<i data-lucide="check-check" class="w-4 h-4"></i> Marcar todas como lidas`;
                lucide.createIcons({root: btn});
            }
        };

        window.logout = async () => {
            if(confirm('Tem a certeza que deseja sair?')) { 
                await signOut(auth); 
                window.location.href = 'login.html'; 
            }
        };
    </script>
</body>
</html>
