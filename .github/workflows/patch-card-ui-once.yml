name: Patch customer card checkout UI once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'chore(payments): patch customer card checkout UI [skip ci]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch dashboard card flow
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('dashboard.html')
          text = path.read_text(encoding='utf-8')

          old = '''<input type="radio" name="topUpMethod" value="bank" class="peer sr-only" onchange="window.toggleBankDetails(this.value)">
                            <div class="selection-chip p-3 rounded-xl text-center text-xs font-bold peer-checked:text-white peer-checked:border-blue-500 peer-checked:bg-blue-500/20 transition-all shadow-sm">BANCO</div>'''
          new = '''<input type="radio" name="topUpMethod" value="card" class="peer sr-only" onchange="window.toggleBankDetails(this.value)">
                            <div class="selection-chip p-3 rounded-xl text-center text-xs font-bold peer-checked:text-white peer-checked:border-blue-500 peer-checked:bg-blue-500/20 transition-all shadow-sm">VISA / MASTERCARD</div>'''
          if old not in text:
              raise SystemExit('Card method markup not found; refusing partial patch.')
          text = text.replace(old, new, 1)

          phone_marker = '''<div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Número de Telefone para Pagamento</label>'''
          phone_new = '''<div id="topUpPhoneWrap">
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Número de Telefone para Pagamento</label>'''
          if phone_marker not in text:
              raise SystemExit('Phone wrapper marker not found; refusing partial patch.')
          text = text.replace(phone_marker, phone_new, 1)

          bank_pattern = re.compile(r'<div id="bankDetails"[\\s\\S]*?</div>\\n                <button type="submit" id="btnProcessTopUp">', re.M)
          card_block = '''<div id="bankDetails" class="hidden bg-slate-950 rounded-xl p-4 border border-blue-500/30 text-sm text-slate-300">
                    <p class="mb-2 text-blue-400 font-bold flex items-center gap-1"><i data-lucide="shield-check" class="w-4 h-4"></i> Pagamento com cartão</p>
                    <p class="text-white font-semibold">Visa ou Mastercard</p>
                    <p class="mt-1">O pagamento será concluído num checkout seguro PayGo.</p>
                    <p class="mt-2 text-xs text-slate-400 border-t border-white/5 pt-2">Valor mínimo para cartão: 50 MT. Os dados do cartão não são introduzidos na PayGo.</p>
                </div>
                <button type="submit" id="btnProcessTopUp">'''
          text, count = bank_pattern.subn(card_block, text, count=1)
          if count != 1:
              raise SystemExit('Payment info block marker not found; refusing partial patch.')

          marker = '</body>\n</html>'
          override = r'''
<script type="module">
  const CARD_METHOD = 'card';
  const CARD_MINIMUM = 50;
  const firebaseConfigCardCheckout = {
    apiKey: "AIzaSyAHxyX5e9O8qQo6Z3VHURgVXhxbxSp0Qh8",
    authDomain: "paygo-14311.firebaseapp.com",
    projectId: "paygo-14311",
    storageBucket: "paygo-14311.firebasestorage.app",
    messagingSenderId: "208360646277",
    appId: "1:208360646277:web:aecc57cc0077ae48a52bec"
  };

  let cardFirebase;
  let cardAuth;
  let cardDb;

  async function getCardFirebase() {
    if (cardAuth && cardDb) return { auth: cardAuth, db: cardDb };
    const [{ initializeApp, getApps }, { getAuth }, firestore] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js'),
      import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js')
    ]);
    const existing = getApps().find(app => app.name === 'paygo-card-checkout');
    cardFirebase = existing || initializeApp(firebaseConfigCardCheckout, 'paygo-card-checkout');
    cardAuth = getAuth(cardFirebase);
    cardDb = firestore.getFirestore(cardFirebase, 'paygodb');
    return { auth: cardAuth, db: cardDb };
  }

  function selectedTopUpMethod() {
    return document.querySelector('input[name="topUpMethod"]:checked')?.value || 'mpesa';
  }

  function setCardUi(method) {
    const card = method === CARD_METHOD;
    const phoneWrap = document.getElementById('topUpPhoneWrap');
    const phone = document.getElementById('topUpPhone');
    const info = document.getElementById('bankDetails');
    const button = document.getElementById('btnProcessTopUp');
    if (phoneWrap) phoneWrap.classList.toggle('hidden', card);
    if (phone) {
      phone.disabled = card;
      if (card) phone.removeAttribute('required');
      else phone.setAttribute('required', 'true');
    }
    if (info) info.classList.toggle('hidden', !card);
    if (button) button.textContent = card ? 'Continuar para pagamento seguro' : 'Gerar Pagamento';
  }

  window.toggleBankDetails = setCardUi;

  function resetCardUi() {
    setCardUi(selectedTopUpMethod());
  }

  async function processCardTopUp(event) {
    event?.preventDefault?.();
    event?.stopImmediatePropagation?.();

    const btn = document.getElementById('btnProcessTopUp');
    const amount = Number.parseFloat(document.getElementById('topUpAmount')?.value || document.getElementById('topUpMtInput')?.value || '0');
    if (!Number.isFinite(amount) || amount < CARD_MINIMUM) {
      window.showToast?.(`Para pagamento com cartão, o mínimo é ${CARD_MINIMUM} MT.`, 'warning', 5000);
      return;
    }

    const original = btn?.innerHTML || '';
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> A preparar checkout...';
      window.lucide?.createIcons?.({ root: btn });
    }

    try {
      const { auth, db } = await getCardFirebase();
      const user = auth.currentUser;
      if (!user) throw new Error('A sessão expirou. Inicie sessão novamente.');

      const topupId = 'TOP-' + Date.now().toString().slice(-8);
      const firestore = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');

      await firestore.setDoc(firestore.doc(db, 'topups', topupId), {
        topupId,
        userId: user.uid,
        amount: Number(amount.toFixed(2)),
        method: CARD_METHOD,
        phone: null,
        status: 'pending',
        paymentStatus: 'pending',
        provider: 'netshop',
        createdAt: firestore.serverTimestamp(),
        updatedAt: firestore.serverTimestamp()
      });

      const response = await fetch('/api/payments/initiate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          topupId,
          orderId: topupId,
          amount: Number(amount.toFixed(2)),
          method: CARD_METHOD,
          description: `Depósito PayGo por cartão ${topupId}`
        })
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.success) {
        throw new Error(data.error || 'Não foi possível criar o checkout do cartão.');
      }

      const checkoutUrl = data.checkoutUrl || data.data?.checkoutUrl || data.data?.checkout_url || data.checkout_url;
      if (!checkoutUrl) throw new Error('O gateway não devolveu o checkout seguro.');

      window.showToast?.('A abrir o pagamento seguro...', 'success', 2500);
      setTimeout(() => { window.location.assign(checkoutUrl); }, 150);
    } catch (error) {
      console.error('[PayGo Card Checkout]', error);
      window.showToast?.(error?.message || 'Falha ao iniciar o pagamento por cartão.', 'error', 7000);
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = original || 'Continuar para pagamento seguro';
        window.lucide?.createIcons?.({ root: btn });
      }
    }
  }

  function installCardFlow() {
    const form = document.getElementById('topUpForm');
    if (!form || form.dataset.cardFlowInstalled === '1') return;
    form.dataset.cardFlowInstalled = '1';
    form.addEventListener('submit', (event) => {
      if (selectedTopUpMethod() !== CARD_METHOD) return;
      processCardTopUp(event);
    }, true);

    document.querySelectorAll('input[name="topUpMethod"]').forEach(input => {
      input.addEventListener('change', () => setCardUi(input.value));
    });

    document.getElementById('topUpModal')?.addEventListener('click', (event) => {
      if (event.target?.id === 'topUpModal') resetCardUi();
    });

    setCardUi(selectedTopUpMethod());
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', installCardFlow, { once: true });
  } else {
    installCardFlow();
  }
</script>
</body>
</html>'''
          if marker not in text:
              raise SystemExit('HTML closing marker not found; refusing partial patch.')
          text = text.replace(marker, override, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit patched dashboard and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/patch-card-ui-once.yml
          git add dashboard.html .github/workflows/patch-card-ui-once.yml
          git commit -m "chore(payments): patch customer card checkout UI [skip ci]"
          git push
