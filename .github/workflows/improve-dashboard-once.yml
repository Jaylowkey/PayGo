name: Improve PayGo dashboard design

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  improve-dashboard:
    if: ${{ !contains(github.event.head_commit.message, '[dashboard-design-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply premium dashboard design
        shell: python
        run: |
          from pathlib import Path

          path = Path('dashboard.html')
          text = path.read_text(encoding='utf-8')

          marker = '</style>'
          if marker not in text:
              raise SystemExit('Closing style tag not found')

          css = r'''

        /* =====================================================
           PayGo Premium UI Refresh
           ===================================================== */
        :root {
            --paygo-bg: #070b14;
            --paygo-surface: rgba(15, 23, 42, 0.78);
            --paygo-border: rgba(148, 163, 184, 0.12);
            --paygo-muted: #94a3b8;
            --paygo-primary: #3b82f6;
        }

        body {
            background:
                radial-gradient(900px 500px at -10% -10%, rgba(37,99,235,.20), transparent 65%),
                radial-gradient(700px 450px at 110% 15%, rgba(14,165,233,.12), transparent 62%),
                radial-gradient(700px 500px at 50% 115%, rgba(124,58,237,.10), transparent 65%),
                var(--paygo-bg);
        }

        .glass-nav {
            background: rgba(7, 11, 20, .78) !important;
            border-bottom-color: rgba(148,163,184,.10) !important;
            box-shadow: 0 10px 40px rgba(0,0,0,.18);
        }

        .glass-card, .stat-card, .hero-card {
            border-color: var(--paygo-border) !important;
            box-shadow: 0 20px 70px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.025);
        }

        .glass-card {
            background: linear-gradient(145deg, rgba(30,41,59,.58), rgba(15,23,42,.68)) !important;
        }

        .hero-card {
            background:
                radial-gradient(circle at 85% 10%, rgba(59,130,246,.20), transparent 30%),
                linear-gradient(145deg, rgba(30,41,59,.76), rgba(15,23,42,.84)) !important;
        }

        .realistic-card {
            border: 1px solid rgba(255,255,255,.14) !important;
            background:
                radial-gradient(circle at 90% 0%, rgba(59,130,246,.22), transparent 35%),
                linear-gradient(135deg, #172033 0%, #080c15 100%) !important;
            box-shadow: 0 28px 60px rgba(0,0,0,.48), inset 0 1px 0 rgba(255,255,255,.10) !important;
            transition: transform .25s ease, box-shadow .25s ease !important;
        }

        .realistic-card:hover {
            transform: translateY(-3px) !important;
            box-shadow: 0 34px 70px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.12) !important;
        }

        /* Payment methods become premium selectable cards */
        input[name="topUpMethod"] + .selection-chip {
            position: relative;
            min-height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(148,163,184,.14) !important;
            background: linear-gradient(145deg, rgba(30,41,59,.72), rgba(15,23,42,.88)) !important;
            color: #cbd5e1 !important;
            border-radius: 16px !important;
            letter-spacing: .04em;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 8px 24px rgba(0,0,0,.12);
            transition: transform .2s ease, border-color .2s ease, background .2s ease, box-shadow .2s ease;
        }

        input[name="topUpMethod"] + .selection-chip:hover {
            transform: translateY(-2px);
            border-color: rgba(96,165,250,.35) !important;
            background: linear-gradient(145deg, rgba(37,99,235,.14), rgba(15,23,42,.92)) !important;
        }

        input[name="topUpMethod"]:checked + .selection-chip {
            border-color: rgba(59,130,246,.72) !important;
            background: linear-gradient(145deg, rgba(37,99,235,.28), rgba(30,41,59,.92)) !important;
            color: #fff !important;
            box-shadow: 0 0 0 1px rgba(59,130,246,.18), 0 14px 32px rgba(37,99,235,.16), inset 0 1px 0 rgba(255,255,255,.08);
        }

        /* Provider-specific selected states */
        label:has(input[value="mpesa"]:checked) .selection-chip {
            border-color: rgba(34,197,94,.70) !important;
            background: linear-gradient(145deg, rgba(34,197,94,.18), rgba(15,23,42,.92)) !important;
            box-shadow: 0 12px 30px rgba(34,197,94,.12);
        }

        label:has(input[value="emola"]:checked) .selection-chip {
            border-color: rgba(59,130,246,.75) !important;
            background: linear-gradient(145deg, rgba(59,130,246,.20), rgba(15,23,42,.92)) !important;
        }

        label:has(input[value="mkesh"]:checked) .selection-chip {
            border-color: rgba(16,185,129,.75) !important;
            background: linear-gradient(145deg, rgba(16,185,129,.20), rgba(15,23,42,.92)) !important;
            box-shadow: 0 12px 30px rgba(16,185,129,.14);
        }

        label:has(input[value="bank"]:checked) .selection-chip {
            border-color: rgba(96,165,250,.75) !important;
            background: linear-gradient(145deg, rgba(96,165,250,.18), rgba(15,23,42,.92)) !important;
        }

        /* Inputs */
        input:not([type="radio"]), select, textarea {
            border-color: rgba(148,163,184,.14) !important;
            background: rgba(2,6,23,.58) !important;
            transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
        }

        input:not([type="radio"]):focus, select:focus, textarea:focus {
            border-color: rgba(59,130,246,.65) !important;
            box-shadow: 0 0 0 4px rgba(59,130,246,.10), 0 8px 25px rgba(0,0,0,.12);
            background: rgba(2,6,23,.78) !important;
            outline: none;
        }

        .btn-epic {
            box-shadow: 0 12px 28px rgba(37,99,235,.18), inset 0 1px 0 rgba(255,255,255,.10);
        }

        .btn-epic:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 16px 34px rgba(37,99,235,.24), inset 0 1px 0 rgba(255,255,255,.12);
        }

        /* Mobile polish */
        @media (max-width: 640px) {
            #toastContainer { left: 14px; right: 14px; top: 14px; }
            .glass-card, .hero-card { border-radius: 20px !important; }
            .selection-chip { font-size: 11px !important; }
        }
        '''

          text = text.replace(marker, css + '\n' + marker, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/improve-dashboard-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.html .github/workflows/improve-dashboard-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat: premium PayGo dashboard UI [dashboard-design-auto]"
          git push
