name: Sync PayGo Admin Theme

on:
  push:
    branches: [main]
    paths:
      - 'admin/*.html'
      - 'admin/admin-theme.css'
      - '.github/workflows/admin-theme-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[admin-theme-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject shared PayGo Admin theme
        shell: bash
        run: |
          set -euo pipefail
          changed=0
          for file in admin/*.html; do
            [ -f "$file" ] || continue
            if ! grep -q 'admin/admin-theme.css' "$file"; then
              python3 - "$file" <<'PY'
import sys
from pathlib import Path
p=Path(sys.argv[1])
s=p.read_text(encoding='utf-8')
needle='</head>'
if needle not in s:
    raise SystemExit(f'No </head> in {p}')
block='  <link rel="stylesheet" href="admin-theme.css">\n'
s=s.replace(needle, block+needle, 1)
p.write_text(s, encoding='utf-8')
PY
              changed=1
            fi
          done
          if [ "$changed" -eq 1 ]; then
            git config user.name 'paygo-admin-theme[bot]'
            git config user.email 'paygo-admin-theme[bot]@users.noreply.github.com'
            git add admin/*.html
            git commit -m 'chore(admin): sync reference-inspired theme [admin-theme-sync]'
            git push
          else
            echo 'Admin theme already synchronized.'
          fi
