name: Add mKesh support

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-mkesh:
    if: ${{ !contains(github.event.head_commit.message, '[mkesh-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch PayGo
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Pattern not found: {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # ZumboPay service
          replace_once(
              'api/lib/services/zumbopay.js',
              '    walletEmola:\n      process.env.ZUMBOPAY_WALLET_EMOLA || "",\n\n    walletCard:',
              '    walletEmola:\n      process.env.ZUMBOPAY_WALLET_EMOLA || "",\n\n    walletMkesh:\n      process.env.ZUMBOPAY_WALLET_MKESH || "",\n\n    walletCard:'
          )
          replace_once(
              'api/lib/services/zumbopay.js',
              '    case "emola":\n      return config.walletEmola;\n\n    case "card":',
              '    case "emola":\n      return config.walletEmola;\n\n    case "mkesh":\n      return config.walletMkesh;\n\n    case "card":'
          )
          replace_once(
              'api/lib/services/zumbopay.js',
              '    case "emola":\n    case "e-mola":\n    case "e_mola":\n    case "emola":\n      return "emola";\n\n    case "card":',
              '    case "emola":\n    case "e-mola":\n    case "e_mola":\n    case "emola":\n      return "emola";\n\n    case "mkesh":\n    case "m-kesh":\n    case "m_kesh":\n    case "m kesh":\n      return "mkesh";\n\n    case "card":'
          )
          replace_once(
              'api/lib/services/zumbopay.js',
              '    normalizedMethod !== "mpesa" &&\n    normalizedMethod !== "emola"\n  ) {',
              '    normalizedMethod !== "mpesa" &&\n    normalizedMethod !== "emola" &&\n    normalizedMethod !== "mkesh"\n  ) {'
          )
          replace_once(
              'api/lib/services/zumbopay.js',
              '"createCharge suporta apenas M-Pesa e e-Mola."',
              '"createCharge suporta apenas M-Pesa, e-Mola e mKesh."'
          )

          # Payment initiate endpoint
          replace_once(
              'api/payments/initiate.js',
              '    if (method === "mpesa" || method === "emola") {',
              '    if (method === "mpesa" || method === "emola" || method === "mkesh") {'
          )
          replace_once(
              'api/payments/initiate.js',
              '      if (method === "emola" && !/^2588[67]\\d{7}$/.test(msisdn)) {\n        return json(res, 400, { success: false, error: "Para e-Mola utilize um número 86 ou 87." });\n      }\n\n      const topup = await createPendingTopUp({',
              '      if (method === "emola" && !/^2588[67]\\d{7}$/.test(msisdn)) {\n        return json(res, 400, { success: false, error: "Para e-Mola utilize um número 86 ou 87." });\n      }\n\n      if (method === "mkesh" && !/^2588[23]\\d{7}$/.test(msisdn)) {\n        return json(res, 400, { success: false, error: "Para mKesh utilize um número 82 ou 83." });\n      }\n\n      const topup = await createPendingTopUp({'
          )
          replace_once(
              'api/payments/initiate.js',
              '      supportedMethods: ["mpesa", "emola", "card"],',
              '      supportedMethods: ["mpesa", "emola", "mkesh", "card"],'
          )

          # Dashboard UI + client validation
          replace_once(
              'dashboard.html',
              'Número M-Pesa ou e-Mola que receberá o pedido de pagamento.',
              'Número M-Pesa, e-Mola ou mKesh que receberá o pedido de pagamento.'
          )

          marker = '                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Método de Pagamento</label>'
          p = Path('dashboard.html')
          text = p.read_text(encoding='utf-8')
          pos = text.find(marker)
          if pos < 0:
              raise SystemExit('Método de Pagamento não encontrado no dashboard.')
          end = text.find('                <div id="bankDetails"', pos)
          if end < 0:
              raise SystemExit('bankDetails não encontrado no dashboard.')
          section = text[pos:end]
          section = section.replace('grid-cols-3 gap-2', 'grid-cols-4 gap-2', 1)
          bank = '''                        <label class="cursor-pointer">\n                            <input type="radio" name="topUpMethod" value="bank" class="peer sr-only" onchange="window.toggleBankDetails(this.value)">\n                            <div class="selection-chip p-3 rounded-xl text-center text-xs font-bold peer-checked:text-white peer-checked:border-blue-500 peer-checked:bg-blue-500/20 transition-all shadow-sm">BANCO</div>\n                        </label>'''
          mkesh = '''                        <label class="cursor-pointer">\n                            <input type="radio" name="topUpMethod" value="mkesh" class="peer sr-only" onchange="window.toggleBankDetails(this.value)">\n                            <div class="selection-chip p-3 rounded-xl text-center text-xs font-bold peer-checked:text-white peer-checked:border-green-500 peer-checked:bg-green-500/20 transition-all shadow-sm">mKESH</div>\n                        </label>\n'''
          if bank not in section:
              raise SystemExit('Bloco BANCO não encontrado no dashboard.')
          section = section.replace(bank, mkesh + bank, 1)
          text = text[:pos] + section + text[end:]
          p.write_text(text, encoding='utf-8')

          replace_once(
              'dashboard.html',
              '''        if (\n            !/^(8[4-7])\\d{7}$/.test(\n                localPhone\n            )\n        ) {\n            throw new Error(\n                'Número inválido. Use um número M-Pesa/e-Mola válido, por exemplo 841234567.'\n            );\n        }''',
              '''        if (\n            (method === 'mkesh' && !/^8[23]\\d{7}$/.test(localPhone)) ||\n            (method === 'mpesa' && !/^8[45]\\d{7}$/.test(localPhone)) ||\n            (method === 'emola' && !/^8[67]\\d{7}$/.test(localPhone))\n        ) {\n            throw new Error(\n                method === 'mkesh'\n                    ? 'Número inválido. Para mKesh utilize um número 82 ou 83, por exemplo 821234567.'\n                    : method === 'mpesa'\n                        ? 'Número inválido. Para M-Pesa utilize um número 84 ou 85.'\n                        : 'Número inválido. Para e-Mola utilize um número 86 ou 87.'\n            );\n        }'''
          )

          replace_once(
              'dashboard.html',
              "`A iniciar pagamento via ${method === 'mpesa' ? 'M-Pesa' : 'e-Mola'}...`,",
              "`A iniciar pagamento via ${method === 'mpesa' ? 'M-Pesa' : method === 'emola' ? 'e-Mola' : 'mKesh'}...`,"
          )

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/add-mkesh-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/lib/services/zumbopay.js api/payments/initiate.js dashboard.html .github/workflows/add-mkesh-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat: add mKesh topups [mkesh-auto]"
          git push
