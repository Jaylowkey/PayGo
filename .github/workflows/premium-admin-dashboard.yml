name: Premium PayGo Admin Dashboard

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  premium-dashboard:
    if: ${{ !contains(github.event.head_commit.message, '[admin-dashboard-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply visible premium refresh
        shell: python
        run: |
          from pathlib import Path
          path = Path('admin/dashboard.html')
          text = path.read_text(encoding='utf-8')

          marker = '<main class="md:ml-64 p-4 md:p-8 pt-24 md:pt-8 min-h-screen transition-all relative z-10" role="main">'
          banner = r'''
          <div class="premium-command-strip mb-6 rounded-2xl border border-blue-500/20 bg-gradient-to-r from-blue-950/80 via-slate-900/90 to-cyan-950/70 px-5 py-3 shadow-[0_12px_40px_rgba(0,0,0,.25)] flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
              <div class="flex items-center gap-3">
                  <span class="inline-flex h-9 w-9 items-center justify-center rounded-xl bg-blue-500/15 border border-blue-400/20 text-blue-300">⚡</span>
                  <div>
                      <div class="text-[10px] font-black uppercase tracking-[.18em] text-blue-300">PayGo OS • Command Center</div>
                      <div class="text-xs text-slate-300">Operações financeiras, B2C, cartões, afiliados e controlo administrativo</div>
                  </div>
              </div>
              <div class="inline-flex items-center gap-2 self-start sm:self-auto rounded-full border border-emerald-400/20 bg-emerald-500/10 px-3 py-1.5 text-[10px] font-black uppercase tracking-widest text-emerald-300">
                  <span class="h-2 w-2 rounded-full bg-emerald-400 animate-pulse"></span> Produção
              </div>
          </div>
          '''
          if 'premium-command-strip' not in text:
              if marker not in text:
                  raise SystemExit('Dashboard main marker not found')
              text = text.replace(marker, marker + '\n' + banner, 1)

          css_marker = '</style>'
          css = r'''
          /* Premium Admin Dashboard v3 */
          body { background: radial-gradient(900px 520px at -10% -10%, rgba(37,99,235,.18), transparent 62%), radial-gradient(760px 480px at 110% 10%, rgba(6,182,212,.12), transparent 60%), #020617 !important; }
          .premium-command-strip { animation: adminStripIn .45s ease-out both; }
          @keyframes adminStripIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
          .glass-card { background: linear-gradient(145deg, rgba(30,41,59,.62), rgba(15,23,42,.78)) !important; border-color: rgba(148,163,184,.12) !important; box-shadow: 0 22px 60px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.025) !important; }
          .glass-card:hover { transform: translateY(-2px); }
          #btnRefresh, #btnSubmitManualPayout { box-shadow: 0 12px 30px rgba(37,99,235,.22), inset 0 1px 0 rgba(255,255,255,.12); }
          #manualPayoutModal > div { border-color: rgba(59,130,246,.30) !important; box-shadow: 0 30px 90px rgba(0,0,0,.55), 0 0 45px rgba(37,99,235,.10); }
          @media (max-width: 640px) { .premium-command-strip { border-radius: 16px !important; } }
          '''
          if 'Premium Admin Dashboard v3' not in text:
              if css_marker not in text:
                  raise SystemExit('Closing style tag not found')
              text = text.replace(css_marker, css + '\n' + css_marker, 1)

          text = text.replace('PayGo OS v2.4', 'PayGo OS v3.0', 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/premium-admin-dashboard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/dashboard.html .github/workflows/premium-admin-dashboard.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat: premium admin dashboard v3 [admin-dashboard-auto]"
          git push
